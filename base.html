  // ─── HELPERS ─────────────────────────────────────────────────────────────────
  function formatDaf(num) {
    const L = ['','א','ב','ג','ד','ה','ו','ז','ח','ט','י','יא','יב','יג','יד','טו','טז','יז','יח','יט','כ','כא','כב','כג','כד','כה','כו','כז','כח','כט','ל','לא','לב','לג','לד','לה','לו','לז','לח','לט','מ','מא','מב','מג','מד','מה','מו','מז','מח','מט','נ','נא','נב','נג','נד','נה','נו','נז','נח','נט','ס','סא','סב','סג','סד','סה','סו','סז','סח','סט','ע','עא','עב','עג','עד','עה','עו','עז','עח','עט','פ','פא','פב','פג','פד','פה','פו','פז','פח','פט','צ','צא','צב','צג','צד','צה','צו','צז','צח','צט','ק','קא','קב','קג','קד','קה','קו','קז','קח','קט','קי','קיא','קיב','קיג','קיד','קטו','קטז','קיז','קיח','קיט','קכ','קכא','קכב','קכג','קכד','קכה','קכו','קכז','קכח','קכט','קל','קלא','קלב','קלג','קלד','קלה','קלו','קלז','קלח','קלט','קם','קמא','קמב','קמג','קמד','קמה','קמו','קמז','קמח','קמט','קנ','קנא','קנב','קנג','קנד','קנה','קנו','קנז','קנח','קנט','קס','קסא','קסב','קסג','קסד','קסה','קסו','קסז','קסח','קסט','קע','קעא','קעב','קעג','קעד','קעה','קעו'];
    return L[num] || String(num);
  }

  function normalizePhone(v) { return String(v||'').replace(/\D/g,''); }
  function isValidPhone(p) { return /^\d{9,15}$/.test(p); }
  function escapeHtml(v) { return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

  function buildDafRanges(nums) {
    if (!nums.length) return [];
    const sorted = [...nums].sort((a,b)=>a-b);
    const ranges = []; let start = sorted[0], prev = sorted[0];
    for (let i=1;i<sorted.length;i++) {
      if (sorted[i]===prev+1) { prev=sorted[i]; }
      else { ranges.push({start,end:prev}); start=sorted[i]; prev=sorted[i]; }
    }
    ranges.push({start,end:prev}); return ranges;
  }

  function formatRanges(ranges) {
    return ranges.map(r => r.start===r.end ? formatDaf(r.start) : `${formatDaf(r.start)}-${formatDaf(r.end)}`).join(', ');
  }

  function expandAssignments(records) {
    const out = [];
    records.forEach(r => {
      const end = r.daf_end ?? r.daf;
      for (let d=r.daf; d<=end; d++) out.push({...r, daf:d, range_start:r.daf, range_end:end});
    });
    return out;
  }

  function normalizeRecord(r) {
    return { ...r, daf_end: r.daf_end ?? r.daf, phone: r.phone||'', learned: Boolean(r.learned), is_full_masechet: Boolean(r.is_full_masechet) };
  }

  function formatIcsDate(d) {
    return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
  }

  function buildAssignmentDetails(list) {
    const grouped = {};
    list.forEach(item => {
      if (!grouped[item.masechet]) grouped[item.masechet]=[];
      const end = item.daf_end ?? item.daf;
      for (let d=item.daf; d<=end; d++) grouped[item.masechet].push(d);
    });
    const lines = Object.entries(grouped).map(([m,dafs]) => {
      const u=[...new Set(dafs)].sort((a,b)=>a-b);
      return `מסכת ${m} דפים ${formatRanges(buildDafRanges(u))}`;
    });
    return { lines, html:lines.map(l=>`<div>${escapeHtml(l)}</div>`).join(''), text:lines.join('\n') };
  }

  // ─── GLOBAL STATE ─────────────────────────────────────────────────────────────
  // Stored outside React so modals (plain JS) can access it
  const G = {
    assignments: [],       // expanded flat list
    assignmentRanges: [],  // raw ranges from server
    myAssignments: [],
    verifiedPhone: '',
    config: {...defaultConfig},
    onDataChanged: null,   // callback set by React root
  };

  function getAssignment(masechet, daf) {
    return G.assignments.find(a => a.masechet===masechet && a.daf===daf);
  }
  function getDafStatus(masechet, daf) {
    const a = getAssignment(masechet, daf);
    if (!a) return 'free';
    return a.learned ? 'learned' : 'assigned';
  }
  function getFreeDafim(masechet) {
    const mas = MASECHOT_DATA.find(m=>m.name===masechet);
    if (!mas) return [];
    const free=[];
    for (let d=2; d<=mas.dafim+1; d++) { if (!getAssignment(masechet,d)) free.push(d); }
    return free;
  }

  // ─── API / SDK ────────────────────────────────────────────────────────────────
  async function refreshAssignments() {
    try {
      const res = await fetch('/api/assignments');
      if (!res.ok) throw new Error(res.statusText);
      const data = await res.json();
      G.assignmentRanges = data.map(normalizeRecord);
      G.assignments = expandAssignments(G.assignmentRanges);
      if (G.onDataChanged) G.onDataChanged();
      return true;
    } catch(e) { console.error(e); showToast('שגיאה בטעינת נתונים','error'); return false; }
  }

  window.dataSdk = {
    async init() { return { isOk: await refreshAssignments() }; },
    async create(record, opts={}) {
      try {
        const res = await fetch('/api/assignments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(record)});
        if (!res.ok) return { isOk:false };
        if (!opts.skipRefresh) await refreshAssignments();
        return { isOk:true };
      } catch(e) { return {isOk:false}; }
    },
    async createBulk(records, opts={}) {
      if (!records?.length) return {isOk:false};
      try {
        const res = await fetch('/api/assignments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({assignments:records})});
        if (!res.ok) return {isOk:false};
        if (!opts.skipRefresh) await refreshAssignments();
        return {isOk:true};
      } catch(e) { return {isOk:false}; }
    },
    async update(record, opts={}) {
      if (!record?.id) return {isOk:false};
      try {
        const headers = {'Content-Type':'application/json'};
        const phone = normalizePhone(opts.authPhone||G.verifiedPhone);
        if (phone) headers['X-User-Phone']=phone;
        const res = await fetch(`/api/assignments/${record.id}`,{method:'PUT',headers,body:JSON.stringify(record)});
        if (!res.ok) return {isOk:false};
        if (!opts.skipRefresh) await refreshAssignments();
        return {isOk:true};
      } catch(e) { return {isOk:false}; }
    },
    async delete(record) {
      if (!record?.id) return {isOk:false};
      try {
        const targetDaf = record.target_daf ?? record.targetDaf;
        const url = targetDaf!=null ? `/api/assignments/${record.id}?daf=${encodeURIComponent(targetDaf)}` : `/api/assignments/${record.id}`;
        const headers = {};
        const phone = normalizePhone(record.authPhone||G.verifiedPhone);
        if (phone) headers['X-User-Phone']=phone;
        const res = await fetch(url,{method:'DELETE',headers});
        if (!res.ok) return {isOk:false};
        await refreshAssignments();
        return {isOk:true};
      } catch(e) { return {isOk:false}; }
    }
  };

  // ─── TOAST ───────────────────────────────────────────────────────────────────
  function showToast(msg, type='success') {
    const c = document.getElementById('toast-container');
    if (!c) return;
    const el = document.createElement('div');
    const bg = type==='error'?'bg-red-600':type==='info'?'bg-blue-600':'bg-emerald-600';
    el.className = `toast-enter ${bg} text-white px-4 py-3 rounded-xl shadow-lg text-sm font-medium text-center`;
    el.textContent = msg;
    c.appendChild(el);
    setTimeout(()=>el.remove(), 3000);
  }

  // ─── COUNTDOWN ────────────────────────────────────────────────────────────────
  function getCountdown() {
    let diff = Math.max(0, COUNTDOWN_TARGET - new Date());
    const s = Math.floor(diff/1000);
    return { days:Math.floor(s/86400), hours:Math.floor((s%86400)/3600), minutes:Math.floor((s%3600)/60), seconds:s%60 };
  }

  // ─── CALENDAR / SHARE ─────────────────────────────────────────────────────────
  function openGoogleCalendar(payload) {
    const url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(payload.title)}&details=${encodeURIComponent(payload.details)}&dates=${payload.start}/${payload.end}`;
    window.open(url,'_blank');
  }
  function downloadAppleCalendar(payload) {
    window.location.href = `/api/calendar/ics?title=${encodeURIComponent(payload.title)}&details=${encodeURIComponent(payload.details)}&start=${payload.start}&end=${payload.end}`;
  }
  function openEmail(payload) {
    window.location.href = `mailto:?subject=${encodeURIComponent(payload.title)}&body=${encodeURIComponent(payload.details)}`;
  }
  function openWhatsApp(text) {
    window.open(`https://wa.me/?text=${encodeURIComponent(text)}`,'_blank');
  }
  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); showToast('הועתק!'); }
    catch(e) { showToast('לא ניתן להעתיק','error'); }
  }

  // ─── MODAL SHELL ─────────────────────────────────────────────────────────────
  const Modal = ({ onClose, children, wide=false }) => (
    <div className="modal-bg fixed inset-0 z-50 flex items-center justify-center p-4" onClick={onClose}>
      <div
        className={`bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl w-full ${wide?'max-w-lg':'max-w-sm'} max-h-[85vh] overflow-auto`}
        onClick={e=>e.stopPropagation()}
      >
        {children}
      </div>
    </div>
  );

  // ─── CONFIRM MODAL ────────────────────────────────────────────────────────────
  const ConfirmModal = ({ title, message, onConfirm, onCancel, confirmLabel='אשר', confirmClass='bg-red-600 hover:bg-red-500' }) => (
    <Modal onClose={onCancel}>
      <div className="p-6 text-center space-y-4">
        <h3 className="text-lg font-bold text-white">{title}</h3>
        <p className="text-slate-300 text-sm">{message}</p>
        <div className="flex gap-3 pt-2">
          <button onClick={onCancel} className="flex-1 bg-slate-600 hover:bg-slate-500 text-white font-semibold py-2 rounded-xl transition-all">ביטול</button>
          <button onClick={onConfirm} className={`flex-1 ${confirmClass} text-white font-semibold py-2 rounded-xl transition-all`}>{confirmLabel}</button>
        </div>
      </div>
    </Modal>
  );

  // ─── SUCCESS MODAL ───────────────────────────────────────────────────────────
  const SuccessModal = ({ name, assignments: assignList, onClose }) => {
    const details = buildAssignmentDetails(assignList);
    const title = name ? `לימוד דפים - ${name}` : 'לימוד דפים';
    const shareText = `הרשמתך בוצעה בהצלחה!\nשם: ${name}\nעליך ללמוד:\n${details.text}`;
    const today = new Date();
    const tomorrow = new Date(); tomorrow.setDate(today.getDate()+1);
    const payload = { title, details: `שם: ${name}\nעליך ללמוד:\n${details.text}`, start: formatIcsDate(today), end: formatIcsDate(tomorrow) };
    return (
      <Modal onClose={onClose} wide>
        <div className="p-6 space-y-4">
          <h3 className="text-lg font-bold text-emerald-400">הרשמתך בוצעה בהצלחה! 🎉</h3>
          <p className="text-slate-300 text-sm">עליך ללמוד:</p>
          <div className="bg-slate-700/60 rounded-xl p-3 text-sm text-white space-y-1" dangerouslySetInnerHTML={{__html: details.html}} />
          <div className="grid grid-cols-5 gap-2 text-xs text-center pt-1">
            {[

              { label:'Apple',  action:()=>downloadAppleCalendar(payload), icon:'🍎' },
              { label:'מייל',   action:()=>openEmail(payload), icon:'✉️' },

              <button key={btn.label} onClick={btn.action} className="flex flex-col items-center gap-1 text-slate-300 hover:text-white transition-colors py-2">
                <span className="text-2xl">{btn.icon}</span>
                <span>{btn.label}</span>
              </button>

          <button onClick={onClose} className="w-full mt-2 bg-slate-600 hover:bg-slate-500 text-white font-semibold py-2 rounded-xl transition-all">סגור</button>
        </div>
      </Modal>
    );
  };

  // ─── ASSIGN FORM (single daf) ─────────────────────────────────────────────────
  const AssignDafModal = ({ masechet, daf, onClose, onSuccess }) => {
    const [name,setName]=React.useState('');
    const [phone,setPhone]=React.useState('');
    const [dedication,setDedication]=React.useState('');
    const [loading,setLoading]=React.useState(false);

    const submit = async e => {
      e.preventDefault();
      const p = normalizePhone(phone);
      if (!name.trim()) { showToast('אנא הזן שם','error'); return; }
      if (!isValidPhone(p)) { showToast('אנא הזן מספר טלפון תקין','error'); return; }
      setLoading(true);
      const result = await window.dataSdk.create({ masechet, daf, daf_end:daf, name:name.trim(), phone:p, dedication:dedication.trim(), learned:false, is_full_masechet:false });
      setLoading(false);
      if (result.isOk) { onSuccess(name.trim(),[{masechet,daf,daf_end:daf}]); }
      else { showToast('שגיאה בשיבוץ','error'); }
    };

    return (
      <Modal onClose={onClose}>
        <div className="p-5 space-y-4">
          <h3 className="text-lg font-bold text-amber-400">שיבוץ {masechet} דף {formatDaf(daf)}</h3>
          <form onSubmit={submit} className="space-y-3">
            <div>
              <label className="block text-xs font-medium text-slate-300 mb-1">שם *</label>
              <input type="text" required value={name} onChange={e=>setName(e.target.value)} className="w-full bg-slate-700 border border-slate-600 rounded-xl px-3 py-2 text-white text-sm focus:border-amber-500 focus:outline-none" />
            </div>
            <div>
              <label className="block text-xs font-medium text-slate-300 mb-1">טלפון *</label>
              <input type="tel" inputMode="numeric" required value={phone} onChange={e=>setPhone(e.target.value)} placeholder="05XXXXXXXX" className="w-full bg-slate-700 border border-slate-600 rounded-xl px-3 py-2 text-white text-sm focus:border-amber-500 focus:outline-none" />
            </div>
            <div>
              <label className="block text-xs font-medium text-slate-300 mb-1">הקדשה / הערה</label>
              <textarea value={dedication} onChange={e=>setDedication(e.target.value)} rows={2} placeholder="לעילוי נשמת / לרפואה שלמה..." className="w-full bg-slate-700 border border-slate-600 rounded-xl px-3 py-2 text-white text-sm focus:border-amber-500 focus:outline-none resize-none" />
            </div>
            <button type="submit" disabled={loading} className="w-full bg-amber-600 hover:bg-amber-500 disabled:opacity-50 text-white font-semibold py-2 rounded-xl transition-all text-sm">
              {loading ? 'משבץ...' : 'שבץ'}
            </button>
          </form>
        </div>
      </Modal>
    );
  };

  // ─── AUTO ASSIGN MODAL ────────────────────────────────────────────────────────
  const AutoAssignModal = ({ onClose, onSuccess }) => {
    const [mode,setMode]=React.useState(null); // 'masechet' | 'pages'
    const [name,setName]=React.useState('');
    const [phone,setPhone]=React.useState('');
    const [dedication,setDedication]=React.useState('');
    const [count,setCount]=React.useState(1);
    const takenMasechot = new Set(G.assignmentRanges.filter(a=>a.is_full_masechet).map(a=>a.masechet));
    const firstFree = MASECHOT_DATA.find(m=>!takenMasechot.has(m.name))?.name || MASECHOT_DATA[0].name;
    const [selectedMas,setSelectedMas]=React.useState(firstFree);
    const [pending,setPending]=React.useState(null);
    const [loading,setLoading]=React.useState(false);

    const validate = () => {
      const p=normalizePhone(phone);
      if (!name.trim()) { showToast('אנא הזן שם','error'); return null; }
      if (!isValidPhone(p)) { showToast('אנא הזן מספר טלפון תקין','error'); return null; }
      return { name:name.trim(), phone:p, dedication:dedication.trim() };
    };

    const handleMasechet = e => {
      e.preventDefault();
      const id=validate(); if(!id) return;
      if (takenMasechot.has(selectedMas)) { showToast('מסכת זו כבר הוקצתה','error'); return; }
      const mas=MASECHOT_DATA.find(m=>m.name===selectedMas);
      setPending({ type:'masechet', identity:id, records:[{masechet:selectedMas,daf:2,daf_end:mas.dafim+1,name:id.name,phone:id.phone,dedication:id.dedication,learned:false,is_full_masechet:true}] });
    };

    const handlePages = e => {
      e.preventDefault();
      const id=validate(); if(!id) return;
      const n=Math.max(1,parseInt(count)||1);
      // collect free dafim
      const free=[];
      const partial = MASECHOT_DATA.filter(m=>{ const ma=G.assignments.filter(a=>a.masechet===m.name); return ma.length>0&&ma.length<m.dafim; });
      for (const m of partial) { for (let d=2;d<=m.dafim+1;d++) { if(!getAssignment(m.name,d)) free.push({masechet:m.name,daf:d}); } }
      for (const m of MASECHOT_DATA) { if(!partial.includes(m)) for (let d=2;d<=m.dafim+1;d++) { if(!getAssignment(m.name,d)) free.push({masechet:m.name,daf:d}); } }
      const toAssign=free.slice(0,n);
      if (!toAssign.length) { showToast('אין דפים פנויים','error'); return; }
      const grouped={};
      toAssign.forEach(({masechet,daf})=>{if(!grouped[masechet])grouped[masechet]=[];grouped[masechet].push(daf);});
      const records=[];
      Object.entries(grouped).forEach(([m,dafs])=>{
        buildDafRanges(dafs).forEach(r=>records.push({masechet:m,daf:r.start,daf_end:r.end,name:id.name,phone:id.phone,dedication:id.dedication,learned:false,is_full_masechet:false}));
      });
      setPending({ type:'pages', identity:id, records });
    };

    const execute = async () => {
      setLoading(true);
      const result = pending.records.length===1 && !pending.records[0].is_full_masechet
        ? await window.dataSdk.create(pending.records[0], {skipRefresh:true})
        : await window.dataSdk.createBulk(pending.records, {skipRefresh:true});
      if (result.isOk) { await refreshAssignments(); onSuccess(pending.identity.name, pending.records); }
      else { showToast('שגיאה בשיבוץ','error'); setLoading(false); setPending(null); }
    };

    if (pending) return (
      <Modal onClose={onClose}>
        <div className="p-5 space-y-4">
          <h3 className="text-lg font-bold text-amber-400">אישור שיבוץ</h3>
          <p className="text-white text-sm">שם: {pending.identity.name}</p>
          <div className="bg-slate-700/60 rounded-xl p-3 text-sm text-white space-y-1" dangerouslySetInnerHTML={{__html: buildAssignmentDetails(pending.records).html}} />
          <div className="flex gap-3">
            <button onClick={()=>{setPending(null);setLoading(false);}} className="flex-1 bg-slate-600 hover:bg-slate-500 text-white font-semibold py-2 rounded-xl transition-all text-sm">ביטול</button>
            <button onClick={execute} disabled={loading} className="flex-1 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white font-semibold py-2 rounded-xl transition-all text-sm">{loading?'משבץ...':'אשר'}</button>
          </div>
        </div>
      </Modal>
    );

    if (!mode) return (
      <Modal onClose={onClose}>
        <div className="p-5 space-y-3">
          <h3 className="text-lg font-bold text-amber-400">שבץ אותי</h3>
          <button onClick={()=>setMode('masechet')} className="w-full bg-purple-600 hover:bg-purple-500 text-white font-semibold py-3 rounded-xl transition-all text-sm">🏆 מסכת שלימה</button>
          <button onClick={()=>setMode('pages')} className="w-full bg-purple-600 hover:bg-purple-500 text-white font-semibold py-3 rounded-xl transition-all text-sm">📄 מספר דפים</button>
          <button onClick={onClose} className="w-full bg-slate-600 hover:bg-slate-500 text-white font-semibold py-2 rounded-xl transition-all text-sm">ביטול</button>
        </div>
      </Modal>
    );

    const commonFields = (
      <>
        <div>
          <label className="block text-xs font-medium text-slate-300 mb-1">שם *</label>
          <input type="text" required value={name} onChange={e=>setName(e.target.value)} className="w-full bg-slate-700 border border-slate-600 rounded-xl px-3 py-2 text-white text-sm focus:border-amber-500 focus:outline-none" />
        </div>
        <div>
          <label className="block text-xs font-medium text-slate-300 mb-1">טלפון *</label>
          <input type="tel" inputMode="numeric" required value={phone} onChange={e=>setPhone(e.target.value)} placeholder="05XXXXXXXX" className="w-full bg-slate-700 border border-slate-600 rounded-xl px-3 py-2 text-white text-sm focus:border-amber-500 focus:outline-none" />
        </div>
        <div>
          <label className="block text-xs font-medium text-slate-300 mb-1">הקדשה / הערה</label>
          <textarea value={dedication} onChange={e=>setDedication(e.target.value)} rows={2} placeholder="לעילוי נשמת / לרפואה שלמה..." className="w-full bg-slate-700 border border-slate-600 rounded-xl px-3 py-2 text-white text-sm focus:border-amber-500 focus:outline-none resize-none" />
        </div>
      </>
    );

    if (mode==='masechet') return (
      <Modal onClose={onClose}>
        <div className="p-5 space-y-3">
          <div className="flex items-center gap-2 mb-1">
            <button onClick={()=>setMode(null)} className="text-slate-400 hover:text-white text-xs">← חזרה</button>
            <h3 className="text-lg font-bold text-amber-400">מסכת שלימה</h3>
          </div>
          <form onSubmit={handleMasechet} className="space-y-3">
            {commonFields}
            <div>
              <label className="block text-xs font-medium text-slate-300 mb-1">בחר מסכת</label>
              <select value={selectedMas} onChange={e=>setSelectedMas(e.target.value)} className="w-full bg-slate-700 border border-slate-600 rounded-xl px-3 py-2 text-white text-sm focus:border-amber-500 focus:outline-none">
                {MASECHOT_DATA.map(m=><option key={m.name} value={m.name} disabled={takenMasechot.has(m.name)}>{m.name} ({m.dafim} דפים){takenMasechot.has(m.name)?' - שובצה':''}</option>)}
              </select>
            </div>
            <button type="submit" className="w-full bg-purple-600 hover:bg-purple-500 text-white font-semibold py-2 rounded-xl transition-all text-sm">קח מסכת שלימה</button>
          </form>
        </div>
      </Modal>
    );

    return (
      <Modal onClose={onClose}>
        <div className="p-5 space-y-3">
          <div className="flex items-center gap-2 mb-1">
            <button onClick={()=>setMode(null)} className="text-slate-400 hover:text-white text-xs">← חזרה</button>
            <h3 className="text-lg font-bold text-amber-400">מספר דפים</h3>
          </div>
          <form onSubmit={handlePages} className="space-y-3">
            {commonFields}
            <div>
              <label className="block text-xs font-medium text-slate-300 mb-1">כמה דפים?</label>
              <input type="number" min={1} max={200} value={count} onChange={e=>setCount(e.target.value)} className="w-full bg-slate-700 border border-slate-600 rounded-xl px-3 py-2 text-white text-sm focus:border-amber-500 focus:outline-none" />
            </div>
            <button type="submit" className="w-full bg-purple-600 hover:bg-purple-500 text-white font-semibold py-2 rounded-xl transition-all text-sm">מצא לי דפים</button>
          </form>
        </div>
      </Modal>
    );
  };

  // ─── RANGE ASSIGN MODAL ───────────────────────────────────────────────────────
  const RangeAssignModal = ({ onClose, onSuccess, assignments }) => {
    const [masechet,setMasechet]=React.useState(MASECHOT_DATA[0].name);
    const [name,setName]=React.useState('');
    const [phone,setPhone]=React.useState('');
    const [dedication,setDedication]=React.useState('');
    const [fromDaf,setFromDaf]=React.useState(null);
    const [toDaf,setToDaf]=React.useState(null);
    const [pending,setPending]=React.useState(null);
    const [loading,setLoading]=React.useState(false);

    const freeDafim = React.useMemo(()=>getFreeDafim(masechet),[masechet,assignments]);

    React.useEffect(()=>{ if(freeDafim.length){ setFromDaf(freeDafim[0]); setToDaf(freeDafim[freeDafim.length-1]); } },[masechet]);

    const handleSubmit = e => {
      e.preventDefault();
      const p=normalizePhone(phone);
      if (!name.trim()) { showToast('אנא הזן שם','error'); return; }
      if (!isValidPhone(p)) { showToast('אנא הזן מספר טלפון תקין','error'); return; }
      if (!freeDafim.length) { showToast('אין דפים פנויים','error'); return; }
      const s=Math.min(fromDaf,toDaf), en=Math.max(fromDaf,toDaf);
      const toAssign=freeDafim.filter(d=>d>=s&&d<=en);
      if (!toAssign.length) { showToast('אין דפים פנויים בטווח זה','error'); return; }
      const id={name:name.trim(),phone:p,dedication:dedication.trim()};
      const records=buildDafRanges(toAssign).map(r=>({masechet,daf:r.start,daf_end:r.end,name:id.name,phone:id.phone,dedication:id.dedication,learned:false,is_full_masechet:false}));
      setPending({ identity:id, records });
    };

    const execute = async () => {
      setLoading(true);
      const result = await window.dataSdk.createBulk(pending.records,{skipRefresh:true});
      if (result.isOk) { await refreshAssignments(); onSuccess(pending.identity.name,pending.records); }
      else { showToast('שגיאה בשיבוץ','error'); setLoading(false); setPending(null); }
    };

    if (pending) return (
      <Modal onClose={onClose}>
        <div className="p-5 space-y-4">
          <h3 className="text-lg font-bold text-amber-400">אישור שיבוץ</h3>
          <p className="text-white text-sm">שם: {pending.identity.name}</p>
          <div className="bg-slate-700/60 rounded-xl p-3 text-sm text-white space-y-1" dangerouslySetInnerHTML={{__html: buildAssignmentDetails(pending.records).html}} />
          <div className="flex gap-3">
            <button onClick={()=>{setPending(null);setLoading(false);}} className="flex-1 bg-slate-600 hover:bg-slate-500 text-white font-semibold py-2 rounded-xl transition-all text-sm">ביטול</button>
            <button onClick={execute} disabled={loading} className="flex-1 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white font-semibold py-2 rounded-xl transition-all text-sm">{loading?'משבץ...':'אשר'}</button>
          </div>
        </div>
      </Modal>
    );

    return (
      <Modal onClose={onClose}>
        <div className="p-5 space-y-3">
          <h3 className="text-lg font-bold text-amber-400">שיבוץ טווח דפים</h3>
          <form onSubmit={handleSubmit} className="space-y-3">
            <div>
              <label className="block text-xs font-medium text-slate-300 mb-1">שם *</label>
              <input type="text" required value={name} onChange={e=>setName(e.target.value)} className="w-full bg-slate-700 border border-slate-600 rounded-xl px-3 py-2 text-white text-sm focus:border-amber-500 focus:outline-none" />
            </div>
            <div>
              <label className="block text-xs font-medium text-slate-300 mb-1">טלפון *</label>
              <input type="tel" inputMode="numeric" required value={phone} onChange={e=>setPhone(e.target.value)} placeholder="05XXXXXXXX" className="w-full bg-slate-700 border border-slate-600 rounded-xl px-3 py-2 text-white text-sm focus:border-amber-500 focus:outline-none" />
            </div>
            <div>
              <label className="block text-xs font-medium text-slate-300 mb-1">הקדשה / הערה</label>
              <textarea value={dedication} onChange={e=>setDedication(e.target.value)} rows={2} placeholder="לעילוי נשמת / לרפואה שלמה..." className="w-full bg-slate-700 border border-slate-600 rounded-xl px-3 py-2 text-white text-sm focus:border-amber-500 focus:outline-none resize-none" />
            </div>
            <div>
              <label className="block text-xs font-medium text-slate-300 mb-1">מסכת</label>
              <select value={masechet} onChange={e=>setMasechet(e.target.value)} className="w-full bg-slate-700 border border-slate-600 rounded-xl px-3 py-2 text-white text-sm focus:border-amber-500 focus:outline-none">
                {MASECHOT_DATA.map(m=><option key={m.name} value={m.name}>{m.name}</option>)}
              </select>
            </div>
            {freeDafim.length===0 ? <p className="text-red-400 text-xs">אין דפים פנויים במסכת זו</p> : (
              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="block text-xs font-medium text-slate-300 mb-1">מדף</label>
                  <select value={fromDaf||''} onChange={e=>setFromDaf(parseInt(e.target.value))} className="w-full bg-slate-700 border border-slate-600 rounded-xl px-2 py-2 text-white text-sm focus:border-amber-500 focus:outline-none">
                    {freeDafim.map(d=><option key={d} value={d}>{formatDaf(d)}</option>)}
                  </select>
                </div>
                <div>
                  <label className="block text-xs font-medium text-slate-300 mb-1">עד דף</label>
                  <select value={toDaf||''} onChange={e=>setToDaf(parseInt(e.target.value))} className="w-full bg-slate-700 border border-slate-600 rounded-xl px-2 py-2 text-white text-sm focus:border-amber-500 focus:outline-none">
                    {freeDafim.map(d=><option key={d} value={d}>{formatDaf(d)}</option>)}
                  </select>
                </div>
              </div>
            )}
            <button type="submit" disabled={freeDafim.length===0} className="w-full bg-blue-600 hover:bg-blue-500 disabled:opacity-40 text-white font-semibold py-2 rounded-xl transition-all text-sm">המשך</button>
          </form>
        </div>
      </Modal>
    );
  };

  // ─── PHONE VERIFY MODAL ───────────────────────────────────────────────────────
  const PhoneVerifyModal = ({ onVerified, onClose }) => {
    const [phone,setPhone]=React.useState('');
    const [loading,setLoading]=React.useState(false);
    const submit = async e => {
      e.preventDefault();
      const p=normalizePhone(phone);
      if (!isValidPhone(p)) { showToast('אנא הזן מספר טלפון תקין','error'); return; }
      setLoading(true);
      try {
        const res=await fetch('/api/my-assignments',{headers:{'X-User-Phone':p}});
        if (!res.ok) { showToast('אימות נכשל','error'); setLoading(false); return; }
        const data=await res.json();
        G.myAssignments=data.map(normalizeRecord);
        G.verifiedPhone=p;
        onVerified(p, G.myAssignments);
      } catch(e) { showToast('שגיאה','error'); setLoading(false); }
    };
    return (
      <Modal onClose={onClose}>
        <div className="p-5 space-y-4">
          <h3 className="text-lg font-bold text-amber-400">הדפים שלי</h3>
          <p className="text-slate-400 text-sm">הזן מספר טלפון לצפייה ועריכת הדפים שלך</p>
          <form onSubmit={submit} className="space-y-3">
            <input type="tel" inputMode="numeric" required value={phone} onChange={e=>setPhone(e.target.value)} placeholder="05XXXXXXXX" className="w-full bg-slate-700 border border-slate-600 rounded-xl px-3 py-3 text-white focus:border-amber-500 focus:outline-none" autoFocus />
            <button type="submit" disabled={loading} className="w-full bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white font-semibold py-2 rounded-xl transition-all text-sm">{loading?'מאמת...':'הצג את הדפים שלי'}</button>
          </form>
        </div>
      </Modal>
    );
  };

  // ─── HEADER ──────────────────────────────────────────────────────────────────
  const Header = ({ config, navigate }) => {
    const [cd,setCd]=React.useState(getCountdown());
    const [bannerVisible,setBannerVisible]=React.useState(true);
    React.useEffect(()=>{
      const t=setInterval(()=>setCd(getCountdown()),1000);
      return ()=>clearInterval(t);
    },[]);
    const pad=n=>String(n).padStart(2,'0');
    return (
      <header className="bg-gradient-to-r from-amber-600 to-amber-700 shadow-lg sticky top-0 z-40">
        {bannerVisible && (
          <div className="border-b border-amber-500/40 bg-amber-700/40">
            <div className="max-w-4xl mx-auto px-4 py-2 flex items-center justify-between gap-3 text-xs sm:text-sm">
              <div className="flex flex-wrap items-center gap-2 text-amber-100">
                <span className="font-semibold">ימים לסיום:</span>
                <div className="flex items-center gap-1.5">
                  {[{v:cd.days,l:'ימים'},{v:cd.hours,l:'שעות'},{v:cd.minutes,l:'דקות'},{v:cd.seconds,l:'שניות'}].map(({v,l})=>(
                    <div key={l} className="flex items-center gap-1 bg-slate-900/30 px-2 py-0.5 rounded-lg">
                      <span className="font-bold text-white">{l==='ימים'?v.toLocaleString():pad(v)}</span>
                      <span>{l}</span>
                    </div>
                  ))}
                </div>
              </div>
              <button onClick={()=>setBannerVisible(false)} className="text-amber-100 hover:text-white transition-colors" aria-label="סגור">✕</button>
            </div>
          </div>
        )}
        <div className="max-w-4xl mx-auto px-4 py-3">
          <div className="flex flex-col items-center gap-1">
            <div className="flex items-center gap-3">
              <img src="/יחד אחים.png" alt="יחד אחים" className="h-10 w-10 object-contain drop-shadow-md" />
              <h1 className="text-xl font-bold text-center">{config.site_title}</h1>
            </div>
            <p className="text-amber-100 text-center text-xs">{config.site_subtitle}</p>
          </div>
        </div>
      </header>
    );
  };

  // ─── DASHBOARD ────────────────────────────────────────────────────────────────
  const Dashboard = ({ navigate, assignments, totalAssigned, totalLearned }) => {
    const [modal,setModal]=React.useState(null); // 'auto'|'range'
    const [success,setSuccess]=React.useState(null);

    const pctLearned = totalLearned/TOTAL_DAFIM*100;
    const pctAssigned = (totalAssigned-totalLearned)/TOTAL_DAFIM*100;

    const handleSuccess = (name, recs) => { setModal(null); setSuccess({name,recs}); };

    // pixel map: 1px per daf
    const pixels = React.useMemo(()=>{
      const out=[];
      MASECHOT_DATA.forEach(mas=>{
        for (let d=2;d<=mas.dafim+1;d++) {
          const st=getDafStatus(mas.name,d);
          out.push(st==='learned'?'#10b981':st==='assigned'?'#3b82f6':'#334155');
        }
      });
      return out;
    },[assignments.length]);

    return (
      <div className="max-w-2xl mx-auto p-4 space-y-4 animate-fade-in pb-6">
        {/* Stats */}
        <div className="grid grid-cols-3 gap-3">
          {[
            {v:TOTAL_DAFIM.toLocaleString(), l:'סה״כ דפים', cls:'text-amber-400'},
            {v:(totalAssigned-totalLearned).toLocaleString(), l:'שובצו', cls:'text-blue-400'},
            {v:totalLearned.toLocaleString(), l:'נלמדו', cls:'text-emerald-400'},
          ].map(({v,l,cls})=>(
            <div key={l} className="bg-slate-700/50 rounded-xl p-3 text-center border border-slate-600">
              <div className={`text-xl font-bold ${cls}`}>{v}</div>
              <div className="text-xs text-slate-400">{l}</div>
            </div>
          ))}
        </div>

        {/* Signup / Assign card */}
        <div className="bg-slate-700/50 border border-slate-600 rounded-2xl p-5 space-y-3">
          <h2 className="text-lg font-bold text-amber-400">הצטרפות לסיום הש״ס</h2>
          <p className="text-slate-400 text-sm">בחרו כיצד תרצו להצטרף:</p>
          <div className="grid grid-cols-3 gap-2">
            <button onClick={()=>setModal('auto')} className="flex flex-col items-center gap-1.5 bg-purple-600 hover:bg-purple-500 text-white font-semibold py-3 rounded-xl transition-all text-xs">
              <IcBolt /><span>שבץ אותי</span>
            </button>
            <button onClick={()=>setModal('range')} className="flex flex-col items-center gap-1.5 bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-xl transition-all text-xs">
              <IcRange /><span>שיבוץ טווח</span>
            </button>
            <button onClick={()=>navigate('shasmap')} className="flex flex-col items-center gap-1.5 bg-slate-600 hover:bg-slate-500 text-white font-semibold py-3 rounded-xl transition-all text-xs">
              <IcMap /><span>תן לי לבחור</span>
            </button>
          </div>
        </div>

        {/* Shas Map card */}
        <div onClick={()=>navigate('shasmap')} className="cursor-pointer bg-slate-700/50 border border-slate-600 rounded-2xl p-5 space-y-3 hover:border-amber-500/50 transition-all group">
          <div className="flex justify-between items-center">
            <h2 className="text-lg font-bold text-white">מפת הש״ס</h2>
            <span className="text-xs text-amber-400 opacity-0 group-hover:opacity-100 transition-opacity flex items-center gap-1">לצפייה במפה המלאה <IcBack /></span>
          </div>
          {/* Progress */}
          <div className="space-y-1">
            <div className="flex justify-between text-xs text-slate-400">
              <span>התקדמות כללית</span>
              <span className="text-amber-400 font-semibold">{Math.round(pctLearned)}%</span>
            </div>
            <div className="h-3 bg-slate-600 rounded-full overflow-hidden flex">
              <div className="h-full bg-emerald-500 transition-all duration-700" style={{width:`${pctLearned}%`}} />
              <div className="h-full bg-blue-500 transition-all duration-700" style={{width:`${pctAssigned}%`}} />
            </div>
            <div className="flex gap-3 text-xs text-slate-400">
              <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-emerald-500 inline-block" /> נלמדו</span>
              <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-blue-500 inline-block" /> שובצו</span>
              <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-slate-600 inline-block" /> פנוי</span>
            </div>
          </div>
          {/* Pixel map */}
          <div className="flex flex-wrap gap-px justify-center py-1" style={{lineHeight:0}}>
            {pixels.map((color,i)=>(
              <div key={i} style={{width:3,height:3,backgroundColor:color,borderRadius:1,display:'inline-block'}} />
            ))}
          </div>
        </div>

        {/* My Pages button */}
        <button onClick={()=>navigate('mypages')} className="w-full flex items-center justify-center gap-2 bg-slate-700/50 border border-slate-600 hover:border-slate-400 text-white font-semibold py-4 rounded-2xl transition-all text-sm">
          <IcBook /><span>הדפים שלי</span>
        </button>

        {/* Modals */}
        {modal==='auto' && <AutoAssignModal
          onClose={()=>setModal(null)}
          onSuccess={handleSuccess}
        />}
        {modal==='range' && <RangeAssignModal
          onClose={()=>setModal(null)}
          onSuccess={handleSuccess}
          assignments={assignments}
        />}
        {success && <SuccessModal name={success.name} assignments={success.recs} onClose={()=>setSuccess(null)} />}
      </div>
    );
  };

  // ─── SHAS MAP VIEW ────────────────────────────────────────────────────────────
  const ShasMapView = ({ navigate, assignments }) => {
    const [expanded,setExpanded]=React.useState(null);
    const [assignTarget,setAssignTarget]=React.useState(null); // {masechet,daf}
    const [viewTarget,setViewTarget]=React.useState(null); // {masechet,daf,assignment}
    const [success,setSuccess]=React.useState(null);

    const handleDafClick = (masechet, daf) => {
      const a = getAssignment(masechet, daf);
      if (!a) { setAssignTarget({masechet, daf}); }
      else { setViewTarget({masechet, daf, assignment:a}); }
    };

    return (
      <div className="flex flex-col h-screen bg-slate-900 animate-fade-in overflow-hidden">
        {/* Header */}
        <div className="bg-slate-800/95 border-b border-slate-700 z-40 flex-shrink-0">
          <div className="max-w-full px-4 py-3 flex items-center justify-between">
            <button onClick={()=>navigate('home')} className="flex items-center gap-2 text-amber-400 hover:text-amber-300 transition-colors text-sm font-medium">
              <IcBack /> ראשי
            </button>
            <h2 className="text-lg font-bold text-white">מפת הש״ס</h2>
            <div className="flex flex-wrap gap-x-3 gap-y-1 justify-end text-xs">
              {Object.entries(SEDER_COLORS).map(([s,c])=>(
                <span key={s} className="flex items-center gap-1 text-slate-300">
                  <span className={`w-2.5 h-2.5 rounded-full inline-block ${c.bg}`} />{s}
                </span>
              ))}
            </div>
          </div>
          <div className="flex gap-4 px-4 pb-2 text-xs text-slate-400">
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded inline-block bg-emerald-500" /> נלמד</span>
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded inline-block bg-blue-500" /> משובץ</span>
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded inline-block bg-slate-600 border border-slate-500" /> פנוי</span>
          </div>
        </div>

        {/* Worms container */}
        <div className="flex-1 overflow-x-auto overflow-y-hidden hide-scrollbar px-2 py-3">
          <div className="flex gap-1 h-full items-stretch" style={{minWidth:'max-content'}}>
            {MASECHOT_DATA.map(mas=>{
              const isExp = expanded===mas.name;
              const color = SEDER_COLORS[mas.seder];
              // height proportional to dafim count relative to largest masechet
              const heightPct = (mas.dafim / MAX_DAFIM) * 100;

              return (
                <div
                  key={mas.name}
                  className="flex items-end justify-center h-full"
                  style={{flexShrink:0}}
                >
                  <div
                    onClick={()=>setExpanded(isExp?null:mas.name)}
                    className={`worm relative flex flex-col cursor-pointer select-none border border-white/10 shadow-lg
                      ${color.bg} ${isExp?'rounded-2xl':'rounded-full'}`}
                    style={{
                      width: isExp ? 220 : 18,
                      height: `${heightPct}%`,
                      minHeight: isExp ? 120 : 28,
                      overflow: isExp ? 'hidden' : 'visible',
                    }}
                  >
                    {/* Collapsed: vertical name */}
                    {!isExp && (
                      <div
                        className="absolute inset-0 flex items-center justify-center"
                        style={{writingMode:'vertical-rl', transform:'rotate(180deg)', fontSize:10, fontWeight:700, color:'rgba(255,255,255,0.9)', letterSpacing:'0.12em', whiteSpace:'nowrap'}}
                      >
                        {mas.name}
                      </div>
                    )}

                    {/* Expanded content */}
                    {isExp && (
                      <div className="flex flex-col h-full p-3 animate-fade-in overflow-hidden">
                        <div className="flex justify-between items-baseline mb-2 flex-shrink-0">
                          <span className="font-black text-white text-sm">{mas.name}</span>
                          <span className="text-[10px] text-white/80 bg-white/20 px-1.5 py-0.5 rounded-full">{mas.dafim}</span>
                        </div>
                        <div className="flex-1 overflow-y-auto" style={{scrollbarWidth:'thin',scrollbarColor:'rgba(255,255,255,0.3) transparent'}}>
                          <div className="flex flex-wrap gap-1 pb-2">
                            {Array.from({length:mas.dafim},(_, i)=>i+2).map(d=>{
                              const st=getDafStatus(mas.name,d);
                              let cls='';
                              if (st==='learned') cls='bg-white text-slate-800 shadow-sm';
                              else if (st==='assigned') cls='bg-slate-900/50 text-white/80 border border-transparent';
                              else cls='bg-white/10 text-white/70 border border-white/20 hover:bg-white/25';
                              return (
                                <div key={d} onClick={e=>{e.stopPropagation();handleDafClick(mas.name,d);}}
                                  title={`${mas.name} ${formatDaf(d)}`}
                                  className={`w-7 h-7 text-[10px] flex items-center justify-center rounded-md font-bold cursor-pointer transition-colors ${cls}`}
                                >{formatDaf(d)}</div>
                              );
                            })}
                          </div>
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        </div>

        {/* Modals */}
        {assignTarget && (
          <AssignDafModal
            masechet={assignTarget.masechet}
            daf={assignTarget.daf}
            onClose={()=>setAssignTarget(null)}
            onSuccess={(name,recs)=>{setAssignTarget(null);setSuccess({name,recs});}}
          />
        )}
        {viewTarget && (
          <Modal onClose={()=>setViewTarget(null)}>
            <div className="p-5 space-y-3">
              <h3 className="text-lg font-bold text-amber-400">{viewTarget.masechet} דף {formatDaf(viewTarget.daf)}</h3>
              <div className="bg-slate-700/60 rounded-xl p-3 text-sm space-y-1">
                {viewTarget.assignment.name && <p className="text-white">שם: {viewTarget.assignment.name}</p>}
                <p className={viewTarget.assignment.learned?'text-emerald-400':'text-blue-400'}>{viewTarget.assignment.learned?'✓ נלמד':'משובץ'}</p>
                {viewTarget.assignment.dedication && <p className="text-slate-400 text-xs">{viewTarget.assignment.dedication}</p>}
              </div>
              <p className="text-slate-500 text-xs">לעריכה ומחיקה יש להיכנס ל"הדפים שלי"</p>
              <button onClick={()=>setViewTarget(null)} className="w-full bg-slate-600 hover:bg-slate-500 text-white font-semibold py-2 rounded-xl transition-all text-sm">סגור</button>
            </div>
          </Modal>
        )}
        {success && <SuccessModal name={success.name} assignments={success.recs} onClose={()=>setSuccess(null)} />}
      </div>
    );
  };

  // ─── MY PAGES VIEW ────────────────────────────────────────────────────────────
  const MyPagesView = ({ navigate }) => {
    const [showVerify,setShowVerify]=React.useState(true);
    const [myData,setMyData]=React.useState([]);
    const [verifiedPhone,setVerifiedPhone]=React.useState('');
    const [editMode,setEditMode]=React.useState(false);
    const [selected,setSelected]=React.useState(new Set());
    const [rangeStart,setRangeStart]=React.useState(null);
    const [confirm,setConfirm]=React.useState(null);
    const [loading,setLoading]=React.useState(false);

    const refresh = async (phone) => {
      const res=await fetch('/api/my-assignments',{headers:{'X-User-Phone':phone||verifiedPhone}});
      if (res.ok) { const d=await res.json(); setMyData(d.map(normalizeRecord)); }
    };

    const onVerified = (phone, data) => {
      setVerifiedPhone(phone);
      G.verifiedPhone=phone;
      setMyData(data);
      setShowVerify(false);
    };

    // group by masechet
    const orderIndex = new Map(MASECHOT_DATA.map((m,i)=>[m.name,i]));
    const byMasechet = {};
    myData.forEach(a=>{ if(!byMasechet[a.masechet]) byMasechet[a.masechet]=[]; byMasechet[a.masechet].push(a); });
    const sortedMas = Object.keys(byMasechet).sort((a,b)=>(orderIndex.get(a)??999)-(orderIndex.get(b)??999));

    const handlePageClick = (masechet, daf) => {
      if (!editMode) return;
      const id=`${masechet}-${daf}`;
      const ns=new Set(selected);
      if (!rangeStart) {
        setRangeStart({masechet,daf});
        if (ns.has(id)) ns.delete(id); else ns.add(id);
      } else {
        if (rangeStart.masechet===masechet) {
          const s=Math.min(rangeStart.daf,daf), en=Math.max(rangeStart.daf,daf);
          for (let d=s;d<=en;d++) ns.add(`${masechet}-${d}`);
        } else { ns.add(id); }
        setRangeStart(null);
      }
      setSelected(ns);
    };

    const markLearnedSelected = async () => {
      setLoading(true);
      for (const id of selected) {
        const [m,...rest]=id.split('-'); const daf=parseInt(rest.join('-'));
        const rec=myData.find(a=>a.masechet===m&&a.daf===daf);
        if (!rec||rec.learned) continue;
        await window.dataSdk.update({id:rec.id,learned:true,target_daf:daf},{authPhone:verifiedPhone,skipRefresh:true});
      }
      await refreshAssignments();
      await refresh(verifiedPhone);
      setSelected(new Set()); setEditMode(false); setLoading(false);
    };

    const deleteSelected = async () => {
      setLoading(true);
      for (const id of selected) {
        const [m,...rest]=id.split('-'); const daf=parseInt(rest.join('-'));
        const rec=myData.find(a=>a.masechet===m&&a.daf===daf);
        if (!rec) continue;
        await window.dataSdk.delete({id:rec.id,target_daf:daf,authPhone:verifiedPhone});
      }
      await refresh(verifiedPhone);
      setSelected(new Set()); setEditMode(false); setLoading(false);
    };

    const deleteRange = async (masechet, from, to) => {
      setLoading(true);
      const s=Math.min(from,to), en=Math.max(from,to);
      for (let d=s;d<=en;d++) {
        const rec=myData.find(a=>a.masechet===masechet&&a.daf===d);
        if (!rec) continue;
        await window.dataSdk.delete({id:rec.id,target_daf:d,authPhone:verifiedPhone});
      }
      await refresh(verifiedPhone);
      setLoading(false);
    };

    const markRangeLearned = async (masechet, from, to) => {
      setLoading(true);
      const s=Math.min(from,to), en=Math.max(from,to);
      for (let d=s;d<=en;d++) {
        const rec=myData.find(a=>a.masechet===masechet&&a.daf===d&&!a.learned);
        if (!rec) continue;
        await window.dataSdk.update({id:rec.id,learned:true,target_daf:d},{authPhone:verifiedPhone,skipRefresh:true});
      }
      await refreshAssignments();
      await refresh(verifiedPhone);
      setLoading(false);
    };

    return (
      <div className="max-w-2xl mx-auto p-4 animate-fade-in pb-32">
        {showVerify && <PhoneVerifyModal onVerified={onVerified} onClose={()=>navigate('home')} />}

        <div className="flex justify-between items-center mb-4">
          <button onClick={()=>navigate('home')} className="flex items-center gap-2 text-amber-400 hover:text-amber-300 transition-colors text-sm">
            <IcBack /> ראשי
          </button>
          <h2 className="text-xl font-bold text-white">הדפים שלי</h2>
          <div className="flex gap-2">
            <button onClick={()=>navigate('shasmap')} className="bg-amber-600 hover:bg-amber-500 text-white text-xs font-semibold px-3 py-1.5 rounded-xl transition-all">+ הוספת דפים</button>
            {!showVerify && myData.length>0 && (
              <button onClick={()=>{setEditMode(!editMode);setSelected(new Set());setRangeStart(null);}}
                className={`flex items-center gap-1 text-xs font-semibold px-3 py-1.5 rounded-xl border transition-all ${editMode?'bg-amber-600 border-amber-500 text-white':'bg-slate-700 border-slate-600 text-slate-300 hover:text-white'}`}>
                <IcEdit />{editMode?'סיום עריכה':'עריכה'}
              </button>
            )}
          </div>
        </div>

        {!showVerify && myData.length===0 && (
          <div className="text-center text-slate-400 py-12">לא נמצאו דפים למספר זה</div>
        )}

        {!showVerify && sortedMas.map((masechet,idx)=>{
          const items=[...byMasechet[masechet]].sort((a,b)=>a.daf-b.daf);
          const uniqueDafim=[...new Set(items.map(i=>i.daf))].sort((a,b)=>a-b);
          const learnedCount=items.filter(i=>i.learned).length;
          return (
            <div key={masechet} className="bg-slate-700/50 border border-slate-600 rounded-2xl p-4 mb-4 space-y-3">
              <div className="flex justify-between items-center border-b border-slate-600 pb-3">
                <h3 className="font-bold text-amber-400 text-base">{masechet}</h3>
                <span className="text-xs text-slate-400">{learnedCount}/{items.length} נלמדו</span>
              </div>

              {/* Range controls */}
              {uniqueDafim.length > 1 && (
                <RangeControls
                  masechet={masechet}
                  uniqueDafim={uniqueDafim}
                  idx={idx}
                  onDelete={(m,from,to)=>setConfirm({type:'deleteRange',masechet:m,from,to})}
                  onMarkLearned={(m,from,to)=>setConfirm({type:'learnRange',masechet:m,from,to})}
                />
              )}

              {/* Page squares */}
              <div className="flex flex-wrap gap-1.5">
                {uniqueDafim.map(daf=>{
                  const item=items.find(i=>i.daf===daf);
                  const isLearned=item?.learned;
                  const pageId=`${masechet}-${daf}`;
                  const isSel=selected.has(pageId);
                  let cls = isLearned
                    ? 'bg-emerald-600/80 text-white border-emerald-500'
                    : 'bg-blue-600/60 text-white border-blue-500';
                  if (isSel) cls='bg-amber-500 text-white border-amber-400 ring-2 ring-amber-400 ring-offset-1 ring-offset-slate-800';
                  return (
                    <button key={daf} onClick={()=>handlePageClick(masechet,daf)}
                      disabled={!editMode}
                      className={`page-sq w-9 h-9 flex items-center justify-center rounded-lg border font-bold text-xs ${cls} ${editMode?'cursor-pointer hover:opacity-90':'cursor-default'}`}>
                      {formatDaf(daf)}
                    </button>
                  );
                })}
              </div>
            </div>
          );
        })}

        {/* Edit mode footer */}
        {editMode && (
          <div className="fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-700 p-4 shadow-2xl z-50">
            <div className="max-w-2xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-3">
              <div className="flex items-center gap-2 text-sm">
                <span className="bg-amber-600 rounded-full p-1.5"><IcEdit /></span>
                <div>
                  <div className="font-bold text-sm">מצב עריכה</div>
                  <div className="text-xs text-slate-400">לחץ על הדף הראשון ואז האחרון לבחירת טווח</div>
                </div>
              </div>
              <div className="flex gap-2 w-full sm:w-auto">
                <button onClick={()=>setConfirm({type:'markLearned'})} disabled={selected.size===0||loading}
                  className="flex-1 sm:flex-none px-4 py-2 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-40 text-white font-semibold rounded-xl text-sm transition-all flex items-center gap-1 justify-center">
                  <IcCheck /> סמן כנלמד
                </button>
                <button onClick={()=>setConfirm({type:'deleteSelected'})} disabled={selected.size===0||loading}
                  className="flex-1 sm:flex-none px-4 py-2 bg-red-600 hover:bg-red-500 disabled:opacity-40 text-white font-semibold rounded-xl text-sm transition-all flex items-center gap-1 justify-center">
                  <IcTrash /> מחיקה
                </button>
              </div>
            </div>
          </div>
        )}

        {/* Confirmation modals */}
        {confirm?.type==='markLearned' && (
          <ConfirmModal title="סימון כנלמד" message={`לסמן ${selected.size} דפים כנלמדו?`} confirmLabel="סמן" confirmClass="bg-emerald-600 hover:bg-emerald-500"
            onConfirm={()=>{setConfirm(null);markLearnedSelected();}} onCancel={()=>setConfirm(null)} />
        )}
        {confirm?.type==='deleteSelected' && (
          <ConfirmModal title="מחיקת שיבוץ" message={`למחוק ${selected.size} דפים?`}
            onConfirm={()=>{setConfirm(null);deleteSelected();}} onCancel={()=>setConfirm(null)} />
        )}
        {confirm?.type==='deleteRange' && (
          <ConfirmModal title="מחיקת טווח" message={`למחוק במסכת ${confirm.masechet} דפים ${formatDaf(confirm.from)}-${formatDaf(confirm.to)}?`}
            onConfirm={()=>{setConfirm(null);deleteRange(confirm.masechet,confirm.from,confirm.to);}} onCancel={()=>setConfirm(null)} />
        )}
        {confirm?.type==='learnRange' && (
          <ConfirmModal title="סימון טווח כנלמד" message={`לסמן במסכת ${confirm.masechet} דפים ${formatDaf(confirm.from)}-${formatDaf(confirm.to)} כנלמד?`}
            confirmLabel="סמן" confirmClass="bg-emerald-600 hover:bg-emerald-500"
            onConfirm={()=>{setConfirm(null);markRangeLearned(confirm.masechet,confirm.from,confirm.to);}} onCancel={()=>setConfirm(null)} />
        )}
      </div>
    );
  };

  // Range controls sub-component
  const RangeControls = ({ masechet, uniqueDafim, idx, onDelete, onMarkLearned }) => {
    const [from,setFrom]=React.useState(uniqueDafim[0]);
    const [to,setTo]=React.useState(uniqueDafim[uniqueDafim.length-1]);
    React.useEffect(()=>{ setFrom(uniqueDafim[0]); setTo(uniqueDafim[uniqueDafim.length-1]); },[masechet]);
    const opts = uniqueDafim.map(d=><option key={d} value={d}>{formatDaf(d)}</option>);
    const selClass="bg-slate-700 border border-slate-600 rounded-lg px-2 py-1 text-white text-xs focus:border-amber-500 focus:outline-none";
    return (
      <div className="flex flex-wrap items-center gap-2 text-xs text-slate-300 bg-slate-800/50 rounded-xl px-3 py-2">
        <span className="text-slate-400">טווח:</span>
        <select value={from} onChange={e=>setFrom(parseInt(e.target.value))} className={selClass}>{opts}</select>
        <span>עד</span>
        <select value={to} onChange={e=>setTo(parseInt(e.target.value))} className={selClass}>{opts}</select>
        <button onClick={()=>onDelete(masechet,from,to)} className="px-2 py-1 bg-red-600/70 hover:bg-red-600 text-white rounded-lg transition-all">מחק</button>
        <button onClick={()=>onMarkLearned(masechet,from,to)} className="px-2 py-1 bg-emerald-600/80 hover:bg-emerald-500 text-white rounded-lg transition-all">סמן כנלמד</button>
      </div>
    );
  };

  // ─── APP ROOT ─────────────────────────────────────────────────────────────────
  const App = () => {
    const [view,setView]=React.useState('home');
    const [assignments,setAssignments]=React.useState([]);
    const [config,setConfig]=React.useState({...defaultConfig});
    const totalAssigned = assignments.length;
    const totalLearned = assignments.filter(a=>a.learned).length;

    React.useEffect(()=>{
      G.onDataChanged = () => setAssignments([...G.assignments]);
      window.dataSdk.init().then(r=>{ if(!r.isOk) console.error('init failed'); });
      fetch('/api/config').then(r=>r.ok?r.json():null).then(d=>{ if(d) setConfig(c=>({...c,...d})); }).catch(()=>{});
    },[]);

    const navigate = v => { setView(v); window.scrollTo(0,0); };

    return (
      <div className="min-h-screen bg-gradient-to-b from-slate-900 to-slate-800">
        <Header config={config} navigate={navigate} />
        {view==='home' && <Dashboard navigate={navigate} assignments={assignments} totalAssigned={totalAssigned} totalLearned={totalLearned} />}
        {view==='shasmap' && <ShasMapView navigate={navigate} assignments={assignments} />}
        {view==='mypages' && <MyPagesView navigate={navigate} />}
      </div>
    );
  };

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

  <div id="toast-container" class="fixed top-4 left-0 right-0 z-[60] flex flex-col items-center gap-2 pointer-events-none px-4"></div>
</body>
</html>
