<body class="bg-slate-900 text-white min-h-screen font-sans antialiased">

  <script type="text/babel">
  // ─── DATA ────────────────────────────────────────────────────────────────────
  const MASECHOT_DATA = [

    { seder:"מועד",   name:"שבת",         dafim:156 },

    { seder:"נשים",   name:"נזיר",        dafim:66  },

    { seder:"נשים",   name:"גיטין",       dafim:90  },
    { seder:"נשים",   name:"קידושין",     dafim:82  },

    { seder:"קדשים",  name:"בכורות",      dafim:61  },
    { seder:"קדשים",  name:"ערכין",       dafim:34  },
    { seder:"קדשים",  name:"תמורה",       dafim:34  },
    { seder:"קדשים",  name:"כריתות",      dafim:28  },
    { seder:"קדשים",  name:"מעילה",       dafim:22  },
    { seder:"קדשים",  name:"תמיד",        dafim:9   },
    { seder:"קדשים",  name:"מדות",        dafim:4   },
    { seder:"קדשים",  name:"קנים",        dafim:4   },
    { seder:"טהרות",  name:"נדה",         dafim:73  },
  ];
  const TOTAL_DAFIM = 2711;
  const TRACTATE_PREVIEW_COLUMNS = {
    largeDafim: 140,
    mediumDafim: 90,
    largeCols: 16,
    mediumCols: 14,
    compactCols: 12,
  };

  const SEDER_COLORS = {
    'זרעים':  { bg:'bg-emerald-600', hover:'hover:bg-emerald-500', hex:'#059669', theme:'seder-zeraim' },
    'מועד':   { bg:'bg-blue-600',    hover:'hover:bg-blue-500',    hex:'#2563eb', theme:'seder-moed' },
    'נשים':   { bg:'bg-fuchsia-600', hover:'hover:bg-fuchsia-500', hex:'#c026d3', theme:'seder-nashim' },
    'נזיקין': { bg:'bg-red-600',     hover:'hover:bg-red-500',     hex:'#dc2626', theme:'seder-nezikin' },
    'קדשים':  { bg:'bg-orange-600',  hover:'hover:bg-orange-500',  hex:'#ea580c', theme:'seder-kodashim' },
    'טהרות':  { bg:'bg-teal-600',    hover:'hover:bg-teal-500',    hex:'#0d9488', theme:'seder-taharot' },
  };
  const FALLBACK_SEDER_COLOR = { bg:'bg-slate-600', hover:'hover:bg-slate-500', hex:'#64748b', theme:'' };

  const COUNTDOWN_TARGET = new Date(2026, 10, 29, 0, 0, 0);

  const defaultConfig = { site_title:"מסיימים ש״ס יחד אחים", site_subtitle:"השלמת הש״ס" };

  // ─── HELPERS ─────────────────────────────────────────────────────────────────
  function formatDaf(num) {
    const L = ['','א','ב','ג','ד','ה','ו','ז','ח','ט','י','יא','יב','יג','יד','טו','טז','יז','יח','יט','כ','כא','כב','כג','כד','כה','כו','כז','כח','כט','ל','לא','לב','לג','לד','לה','לו','לז','לח','לט','מ','מא','מב','מג','מד','מה','מו','מז','מח','מט','נ','נא','נב','נג','נד','נה','נו','נז','נח','נט','ס','סא','סב','סג','סד','סה','סו','סז','סח','סט','ע','עא','עב','עג','עד','עה','עו','עז','עח','עט','פ','פא','פב','פג','פד','פה','פו','פז','פח','פט','צ','צא','צב','צג','צד','צה','צו','צז','צח','צט','ק','קא','קב','קג','קד','קה','קו','קז','קח','קט','קי','קיא','קיב','קיג','קיד','קטו','קטז','קיז','קיח','קיט','קכ','קכא','קכב','קכג','קכד','קכה','קכו','קכז','קכח','קכט','קל','קלא','קלב','קלג','קלד','קלה','קלו','קלז','קלח','קלט','קם','קמא','קמב','קמג','קמד','קמה','קמו','קמז','קמח','קמט','קנ','קנא','קנב','קנג','קנד','קנה','קנו','קנז','קנח','קנט','קס','קסא','קסב','קסג','קסד','קסה','קסו','קסז','קסח','קסט','קע','קעא','קעב','קעג','קעד','קעה','קעו'];
    return L[num] || String(num);
  }

  function normalizePhone(v) { return String(v||'').replace(/\D/g,''); }
  function isValidPhone(p) { return /^\d{9,15}$/.test(p); }
  function escapeHtml(v) { return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

  function buildDafRanges(nums) {
    if (!nums.length) return [];
    const sorted = [...nums].sort((a,b)=>a-b);
    const ranges = []; let start = sorted[0], prev = sorted[0];
    for (let i=1;i<sorted.length;i++) {
      if (sorted[i]===prev+1) { prev=sorted[i]; }
      else { ranges.push({start,end:prev}); start=sorted[i]; prev=sorted[i]; }
    }
    ranges.push({start,end:prev}); return ranges;
  }

  function formatRanges(ranges) {
    return ranges.map(r => r.start===r.end ? formatDaf(r.start) : `${formatDaf(r.start)}-${formatDaf(r.end)}`).join(', ');
  }

  function expandAssignments(records) {
    const out = [];
    records.forEach(r => {
      const end = r.daf_end ?? r.daf;
      for (let d=r.daf; d<=end; d++) out.push({...r, daf:d, range_start:r.daf, range_end:end});
    });
    return out;
  }

  function normalizeRecord(r) {
    return { ...r, daf_end: r.daf_end ?? r.daf, phone: r.phone||'', learned: Boolean(r.learned), is_full_masechet: Boolean(r.is_full_masechet) };
  }

  function normalizeMyAssignments(records) {
    return expandAssignments((records || []).map(normalizeRecord));
  }

  function formatIcsDate(d) {
    return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
  }

  function buildAssignmentDetails(list) {
    const grouped = {};
    list.forEach(item => {
      if (!grouped[item.masechet]) grouped[item.masechet]=[];
      const end = item.daf_end ?? item.daf;
      for (let d=item.daf; d<=end; d++) grouped[item.masechet].push(d);
    });
    const lines = Object.entries(grouped).map(([m,dafs]) => {
      const u=[...new Set(dafs)].sort((a,b)=>a-b);
      return `מסכת ${m} דפים ${formatRanges(buildDafRanges(u))}`;
    });
    return { lines, html:lines.map(l=>`<div>${escapeHtml(l)}</div>`).join(''), text:lines.join('\n') };
  }

  // ─── GLOBAL STATE ─────────────────────────────────────────────────────────────
  // Stored outside React so modals (plain JS) can access it
  const G = {
    assignments: [],       // expanded flat list
    assignmentRanges: [],  // raw ranges from server
    myAssignments: [],
    verifiedPhone: '',
    signupDraft: null,
    config: {...defaultConfig},
    onDataChanged: null,   // callback set by React root
  };

  function getAssignment(masechet, daf) {
    return G.assignments.find(a => a.masechet===masechet && a.daf===daf);
  }
  function getDafStatus(masechet, daf) {
    const a = getAssignment(masechet, daf);
    if (!a) return 'free';
    return a.learned ? 'learned' : 'assigned';
  }
  function getFreeDafim(masechet) {
    const mas = MASECHOT_DATA.find(m=>m.name===masechet);
    if (!mas) return [];
    const free=[];
    for (let d=2; d<=mas.dafim+1; d++) { if (!getAssignment(masechet,d)) free.push(d); }
    return free;
  }
  function getAssignedDafim(masechet) {
    return [...new Set(G.assignments.filter(a=>a.masechet===masechet).map(a=>a.daf))].sort((a,b)=>a-b);
  }
  function getFreeBlocks(masechet) {
    return buildDafRanges(getFreeDafim(masechet)).map(r=>({ ...r, length:r.end-r.start+1 }));
  }
  function clampRatio(value) {
    if (!Number.isFinite(value)) return 0;
    return Math.max(0, Math.min(1, value));
  }
  function getMasechetStats(masechet) {
    const mas = MASECHOT_DATA.find(m=>m.name===masechet);
    const assigned = getAssignedDafim(masechet);
    const learned = new Set(G.assignments.filter(a=>a.masechet===masechet && a.learned).map(a=>a.daf)).size;
    const freeBlocks = getFreeBlocks(masechet);
    return {
      mas,
      assigned: assigned.length,
      learned,
      free: Math.max(0, (mas?.dafim || 0) - assigned.length),
      freeBlocks,
    };
  }
  function buildAutoAssignRecords(count, identity) {
    let remaining = Math.max(1, parseInt(count, 10) || 1);
    const records = [];
    const assignmentCounts = new Map(MASECHOT_DATA.map(m=>[m.name, getAssignedDafim(m.name).length]));
    const partiallyStarted = MASECHOT_DATA.filter(m=>{
      const assigned = assignmentCounts.get(m.name) || 0;
      return assigned > 0 && assigned < m.dafim;
    });
    const notStarted = MASECHOT_DATA.filter(m=>(assignmentCounts.get(m.name) || 0) === 0);
    const consume = blockList => {
      for (const { masechet, start, end } of blockList) {
        if (remaining <= 0) break;
        const take = Math.min(remaining, end - start + 1);
        records.push({
          masechet,
          daf: start,
          daf_end: start + take - 1,
          name: identity.name,
          phone: identity.phone,
          dedication: identity.dedication,
          learned: false,
          is_full_masechet: false,
        });
        remaining -= take;
      }
    };
    consume(partiallyStarted.flatMap(m=>getFreeBlocks(m.name).map(block=>({ masechet:m.name, start:block.start, end:block.end }))));
    if (remaining > 0) {
      consume(notStarted.map(m=>({ masechet:m.name, start:2, end:m.dafim+1 })));
    }
    return records;
  }

  // ─── API / SDK ────────────────────────────────────────────────────────────────
  async function refreshAssignments() {
    try {
      const res = await fetch('/api/assignments');
      if (!res.ok) throw new Error(res.statusText);
      const data = await res.json();
      G.assignmentRanges = data.map(normalizeRecord);
      G.assignments = expandAssignments(G.assignmentRanges);
      if (G.onDataChanged) G.onDataChanged();
      return true;
    } catch(e) { console.error(e); showToast('שגיאה בטעינת נתונים','error'); return false; }
  }

  window.dataSdk = {
    async init() { return { isOk: await refreshAssignments() }; },
    async create(record, opts={}) {
      try {
        const res = await fetch('/api/assignments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(record)});
        if (!res.ok) return { isOk:false };
        if (!opts.skipRefresh) await refreshAssignments();
        return { isOk:true };
      } catch(e) { return {isOk:false}; }
    },
    async createBulk(records, opts={}) {
      if (!records?.length) return {isOk:false};
      try {
        const res = await fetch('/api/assignments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({assignments:records})});
        if (!res.ok) return {isOk:false};
        if (!opts.skipRefresh) await refreshAssignments();
        return {isOk:true};
      } catch(e) { return {isOk:false}; }
    },
    async update(record, opts={}) {
      if (!record?.id) return {isOk:false};
      try {
        const headers = {'Content-Type':'application/json'};
        const phone = normalizePhone(opts.authPhone||G.verifiedPhone);
        if (phone) headers['X-User-Phone']=phone;
        const res = await fetch(`/api/assignments/${record.id}`,{method:'PUT',headers,body:JSON.stringify(record)});
        if (!res.ok) return {isOk:false};
        if (!opts.skipRefresh) await refreshAssignments();
        return {isOk:true};
      } catch(e) { return {isOk:false}; }
    },
    async delete(record) {
      if (!record?.id) return {isOk:false};
      try {
        const targetDaf = record.target_daf ?? record.targetDaf;
        const url = targetDaf!=null ? `/api/assignments/${record.id}?daf=${encodeURIComponent(targetDaf)}` : `/api/assignments/${record.id}`;
        const headers = {};
        const phone = normalizePhone(record.authPhone||G.verifiedPhone);
        if (phone) headers['X-User-Phone']=phone;
        const res = await fetch(url,{method:'DELETE',headers});
        if (!res.ok) return {isOk:false};
        await refreshAssignments();
        return {isOk:true};
      } catch(e) { return {isOk:false}; }
    }
  };

  // ─── TOAST ───────────────────────────────────────────────────────────────────
  function showToast(msg, type='success') {
    const c = document.getElementById('toast-container');
    if (!c) return;
    const el = document.createElement('div');
    const bg = type==='error'?'bg-red-600':type==='info'?'bg-blue-600':'bg-emerald-600';
    el.className = `toast-enter ${bg} text-white px-4 py-3 rounded-xl shadow-lg text-sm font-medium text-center`;
    el.textContent = msg;
    c.appendChild(el);
    setTimeout(()=>el.remove(), 3000);
  }

  // ─── COUNTDOWN ────────────────────────────────────────────────────────────────
  function getCountdown() {
    let diff = Math.max(0, COUNTDOWN_TARGET - new Date());
    const s = Math.floor(diff/1000);
    return { days:Math.floor(s/86400), hours:Math.floor((s%86400)/3600), minutes:Math.floor((s%3600)/60), seconds:s%60 };
  }

  // ─── CALENDAR / SHARE ─────────────────────────────────────────────────────────
  function openGoogleCalendar(payload) {
    const url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(payload.title)}&details=${encodeURIComponent(payload.details)}&dates=${payload.start}/${payload.end}`;
    window.open(url,'_blank');
  }
  function downloadAppleCalendar(payload) {
    window.location.href = `/api/calendar/ics?title=${encodeURIComponent(payload.title)}&details=${encodeURIComponent(payload.details)}&start=${payload.start}&end=${payload.end}`;
  }
  function openEmail(payload) {
    window.location.href = `mailto:?subject=${encodeURIComponent(payload.title)}&body=${encodeURIComponent(payload.details)}`;
  }
  function openWhatsApp(text) {
    window.open(`https://wa.me/?text=${encodeURIComponent(text)}`,'_blank');
  }

    const [phone,setPhone]=React.useState(draft.phone || '');

    const [loading,setLoading]=React.useState(false);

    const validate = () => {
      const p=normalizePhone(phone);
      if (!name.trim()) { showToast('אנא הזן שם','error'); return null; }
      if (!isValidPhone(p)) { showToast('אנא הזן מספר טלפון תקין','error'); return null; }

      G.signupDraft = identity;
      return identity;

      const result = pending.records.length===1 && !pending.records[0].is_full_masechet
        ? await window.dataSdk.create(pending.records[0], {skipRefresh:true})

  // ─── RANGE ASSIGN MODAL ───────────────────────────────────────────────────────

    const draft = G.signupDraft || {};
    const [masechet,setMasechet]=React.useState(MASECHOT_DATA[0].name);
    const [name,setName]=React.useState(draft.name || '');
    const [phone,setPhone]=React.useState(draft.phone || '');
    const [dedication,setDedication]=React.useState(draft.dedication || '');
    const [fromDaf,setFromDaf]=React.useState(null);
    const [toDaf,setToDaf]=React.useState(null);
    const [pending,setPending]=React.useState(null);
    const [loading,setLoading]=React.useState(false);

    const freeDafim = React.useMemo(()=>getFreeDafim(masechet),[masechet,assignments]);

    React.useEffect(()=>{ if(freeDafim.length){ setFromDaf(freeDafim[0]); setToDaf(freeDafim[freeDafim.length-1]); } },[masechet]);

    const handleSubmit = e => {
      e.preventDefault();
      const p=normalizePhone(phone);
      if (!name.trim()) { showToast('אנא הזן שם','error'); return; }
      if (!isValidPhone(p)) { showToast('אנא הזן מספר טלפון תקין','error'); return; }
      if (!freeDafim.length) { showToast('אין דפים פנויים','error'); return; }
      const s=Math.min(fromDaf,toDaf), en=Math.max(fromDaf,toDaf);
      const toAssign=freeDafim.filter(d=>d>=s&&d<=en);
      if (!toAssign.length) { showToast('אין דפים פנויים בטווח זה','error'); return; }
      const id={name:name.trim(),phone:p,dedication:dedication.trim()};
      G.signupDraft = id;
      const records=buildDafRanges(toAssign).map(r=>({masechet,daf:r.start,daf_end:r.end,name:id.name,phone:id.phone,dedication:id.dedication,learned:false,is_full_masechet:false}));
      setPending({ identity:id, records });
    };

    const execute = async () => {
      setLoading(true);
      const result = await window.dataSdk.createBulk(pending.records,{skipRefresh:true});
      if (result.isOk) { await refreshAssignments(); onSuccess(pending.identity.name,pending.records); }
      else { showToast('שגיאה בשיבוץ','error'); setLoading(false); setPending(null); }
    };

    if (pending) return (
      <Modal onClose={onClose}>

  const TractateCard = ({ mas, selected, onOpen }) => {
    const color = SEDER_COLORS[mas.seder] || FALLBACK_SEDER_COLOR;

    const total = Math.max(0, mas.dafim || 0);
    const assigned = Math.min(stats.assigned, total);
    const learned = Math.min(stats.learned, assigned);
    const free = Math.max(0, total - assigned);
    const learnedRatio = clampRatio(total ? learned / total : 0);
    const assignedOnlyRatio = clampRatio(total ? (assigned - learned) / total : 0);
    const freeRatio = clampRatio(total ? free / total : 0);
    const tintStrength = clampRatio(learnedRatio * 0.5);
    const sederHex = color.hex || FALLBACK_SEDER_COLOR.hex;
    const sederRgb = {
      r: parseInt(sederHex.slice(1, 3), 16),
      g: parseInt(sederHex.slice(3, 5), 16),
      b: parseInt(sederHex.slice(5, 7), 16),
    };
    const statsTitle = `סה״כ: ${total} | שובצו: ${assigned} | נלמדו: ${learned} | פנויים: ${free}`;
    const previewColumns = mas.dafim >= TRACTATE_PREVIEW_COLUMNS.largeDafim
      ? TRACTATE_PREVIEW_COLUMNS.largeCols
      : mas.dafim >= TRACTATE_PREVIEW_COLUMNS.mediumDafim

        onClick={onOpen}
        className={`tractate-card ${color.theme} rounded-2xl p-3 sm:p-4 space-y-3`}
        style={{ '--tractate-tint': `rgba(${sederRgb.r}, ${sederRgb.g}, ${sederRgb.b}, ${tintStrength})` }}

  // ─── SHAS MAP VIEW ────────────────────────────────────────────────────────────
  const ShasMapView = ({ navigate, assignments, selectionMode=false, returnTo='home' }) => {
    const [assignTarget,setAssignTarget]=React.useState(null); // {masechet,daf}
    const [viewTarget,setViewTarget]=React.useState(null); // {masechet,daf,assignment}
    const [masechetTarget,setMasechetTarget]=React.useState(null);
    const [success,setSuccess]=React.useState(null);
    const [selected,setSelected]=React.useState(new Set());
    const [rangeStart,setRangeStart]=React.useState(null);
    const [pendingSelection,setPendingSelection]=React.useState(null);
    const [loading,setLoading]=React.useState(false);
    const signupIdentity = G.signupDraft;
    const totalLearned = React.useMemo(
      () => new Set(assignments.filter(a=>a.learned).map(a=>`${a.masechet}|${a.daf}`)).size,
      [assignments]
    );
    const pctOccupied = assignments.length/TOTAL_DAFIM*100;
    const pctLearned = totalLearned/TOTAL_DAFIM*100;

    const resetSelection = () => {
      setSelected(new Set());
      setRangeStart(null);
    };

    const buildSelectionRecords = () => {
      const items = [...selected].map(id => {
        const [masechet, daf] = id.split('|');
        return { masechet, daf:parseInt(daf,10) };
      });
      const grouped = {};
      items.forEach(({masechet,daf}) => {
        if (!grouped[masechet]) grouped[masechet] = [];
        grouped[masechet].push(daf);
      });
      return Object.entries(grouped).flatMap(([masechet,dafim]) =>
        buildDafRanges(dafim).map(r=>({
          masechet,
          daf:r.start,
          daf_end:r.end,
          name:signupIdentity.name,
          phone:signupIdentity.phone,
          dedication:signupIdentity.dedication || '',
          learned:false,
          is_full_masechet:false,
        }))
      );
    };

    const handleSelectionContinue = () => {
      if (!signupIdentity?.name || !signupIdentity?.phone) { showToast('אנא הזן פרטים לפני בחירת דפים','error'); return; }
      if (!selected.size) { showToast('יש לבחור לפחות דף אחד','error'); return; }
      setPendingSelection({ identity:signupIdentity, records:buildSelectionRecords() });
    };

    const executeSelection = async () => {
      setLoading(true);
      const result = await window.dataSdk.createBulk(pendingSelection.records,{skipRefresh:true});
      if (result.isOk) {
        await refreshAssignments();
        setLoading(false);
        setPendingSelection(null);
        resetSelection();
        setSuccess({name:pendingSelection.identity.name,recs:pendingSelection.records});
      } else {
        showToast('שגיאה בשיבוץ','error');
        setLoading(false);
      }
    };

    const toggleSelection = (masechet, daf) => {
      if (getAssignment(masechet, daf)) { showToast('דף זה כבר תפוס','info'); return; }
      const next = new Set(selected);
      const addDaf = value => next.add(`${masechet}|${value}`);
      const removeDaf = value => next.delete(`${masechet}|${value}`);
      if (!rangeStart) {
        const id = `${masechet}|${daf}`;
        if (next.has(id)) removeDaf(daf);
        else addDaf(daf);
        setRangeStart({ masechet, daf });
      } else if (rangeStart.masechet===masechet) {
        const start = Math.min(rangeStart.daf, daf);
        const end = Math.max(rangeStart.daf, daf);
        for (let d=start; d<=end; d++) {
          if (!getAssignment(masechet,d)) addDaf(d);
        }
        setRangeStart(null);
      } else {
        const id = `${masechet}|${daf}`;
        if (next.has(id)) removeDaf(daf);
        else addDaf(daf);
        setRangeStart({ masechet, daf });
      }
      setSelected(next);
    };

    const handleModalDafClick = (masechet, daf) => {
      if (selectionMode) { toggleSelection(masechet, daf); return; }
      const a = getAssignment(masechet, daf);
      setMasechetTarget(null);
      if (!a) { setAssignTarget({masechet, daf}); }
      else { setViewTarget({masechet, daf, assignment:a}); }
    };

    return (
      <div className="flex h-[100dvh] flex-col overflow-hidden bg-slate-900 animate-fade-in">
        {/* Header */}
        <div className="bg-slate-800/95 border-b border-slate-700 z-40 flex-shrink-0">
          <div className="max-w-full px-3 py-2 sm:px-4 sm:py-3 flex items-center justify-between">
            <button onClick={()=>navigate(returnTo)} className="flex items-center gap-2 text-amber-400 hover:text-amber-300 transition-colors text-sm font-medium">
              <IcBack /> {returnTo==='mypages' ? 'הדפים שלי' : 'ראשי'}
            </button>
            <h2 className="text-lg font-bold text-white">מפת הש״ס</h2>
            <div className="flex flex-wrap gap-x-3 gap-y-1 justify-end text-xs">
              {Object.entries(SEDER_COLORS).map(([s,c])=>(
                <span key={s} className="flex items-center gap-1 text-slate-300">
                  <span className={`w-2.5 h-2.5 rounded-full inline-block ${c.bg}`} />{s}
                </span>
              ))}
            </div>
          </div>
          <div className="px-3 pb-2 sm:px-4 sm:pb-3 flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between text-xs">
            <div className="flex flex-wrap gap-4 text-slate-400">
              <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded inline-block bg-emerald-500" /> נלמד</span>
              <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded inline-block bg-blue-500" /> נתפס</span>
              <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded inline-block bg-slate-600 border border-slate-500" /> פנוי</span>
            </div>
            <div className="flex flex-wrap items-center gap-3 text-slate-300">
              <span>נתפסו <span className="text-blue-400 font-semibold">{Math.round(pctOccupied)}%</span></span>
              <span>נלמדו <span className="text-emerald-400 font-semibold">{Math.round(pctLearned)}%</span></span>
            </div>
          </div>
          {selectionMode && (
            <div className="px-3 pb-2 sm:px-4 sm:pb-3 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 text-xs">
              <div className="text-amber-200 bg-amber-500/10 border border-amber-500/30 rounded-xl px-3 py-2">
                בחר דף, או בחר דף ראשון ואחרון לטווח.
              </div>
              <div className="flex items-center gap-2">
                <button onClick={resetSelection} className="px-3 py-2 rounded-xl bg-slate-700 hover:bg-slate-600 text-white">נקה בחירה</button>
                <button onClick={handleSelectionContinue} disabled={!selected.size} className="px-3 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 disabled:opacity-40 text-white font-semibold">
                  המשך עם {selected.size} דפים
                </button>
              </div>
            </div>
          )}
        </div>

        <div className="flex-1 min-h-0 px-2 pb-2 sm:px-3 sm:pb-3">
          <div className="h-full rounded-3xl border border-slate-700 bg-slate-800/40 p-3 sm:p-4 overflow-auto">
            <div className="compact-map-grid">
              {MASECHOT_DATA.map(mas=>(
                <TractateCard
                  key={mas.name}
                  mas={mas}
                  selected={selected}
                  onOpen={()=>setMasechetTarget(mas.name)}
                />
              ))}
            </div>
          </div>
        </div>

        {/* Modals */}
        {assignTarget && (
          <AssignDafModal
            masechet={assignTarget.masechet}
            daf={assignTarget.daf}
            onClose={()=>setAssignTarget(null)}
            onSuccess={(name,recs)=>{setAssignTarget(null);setSuccess({name,recs});}}
          />
        )}
        {viewTarget && (
          <Modal onClose={()=>setViewTarget(null)}>
            <div className="p-5 space-y-3">
              <h3 className="text-lg font-bold text-amber-400">{viewTarget.masechet} דף {formatDaf(viewTarget.daf)}</h3>
              <div className="bg-slate-700/60 rounded-xl p-3 text-sm space-y-1">
                <p className={viewTarget.assignment.learned?'text-emerald-400':'text-blue-400'}>{viewTarget.assignment.learned?'✓ נלמד':'נתפס'}</p>
              </div>
              <p className="text-slate-500 text-xs">לעריכה ומחיקה יש להיכנס ל"הדפים שלי"</p>
              <button onClick={()=>setViewTarget(null)} className="w-full bg-slate-600 hover:bg-slate-500 text-white font-semibold py-2 rounded-xl transition-all text-sm">סגור</button>
            </div>
          </Modal>
        )}
        {masechetTarget && (
          <MasechetDetailModal
            masechet={masechetTarget}
            selectionMode={selectionMode}
            selected={selected}
            rangeStart={rangeStart}
            onDafClick={handleModalDafClick}
            onClose={()=>setMasechetTarget(null)}
            onClearSelection={resetSelection}
            onConfirmSelection={handleSelectionContinue}
          />
        )}
        {pendingSelection && (
          <Modal onClose={()=>setPendingSelection(null)}>
            <div className="p-5 space-y-4">
              <h3 className="text-lg font-bold text-amber-400">אישור שיבוץ</h3>
              <p className="text-white text-sm">שם: {pendingSelection.identity.name}</p>
              <div className="bg-slate-700/60 rounded-xl p-3 text-sm text-white space-y-1" dangerouslySetInnerHTML={{__html: buildAssignmentDetails(pendingSelection.records).html}} />
              <div className="flex gap-3">
                <button onClick={()=>{setPendingSelection(null);setLoading(false);}} className="flex-1 bg-slate-600 hover:bg-slate-500 text-white font-semibold py-2 rounded-xl transition-all text-sm">ביטול</button>
                <button onClick={executeSelection} disabled={loading} className="flex-1 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white font-semibold py-2 rounded-xl transition-all text-sm">{loading?'משבץ...':'אשר'}</button>
              </div>
            </div>
          </Modal>
        )}
        {success && <SuccessModal name={success.name} assignments={success.recs} onClose={()=>{ setSuccess(null); if (selectionMode) navigate(returnTo); }} />}
      </div>
    );
  };

  // ─── MY PAGES VIEW ────────────────────────────────────────────────────────────
  const MyPagesView = ({ navigate }) => {
    const [showVerify,setShowVerify]=React.useState(!G.verifiedPhone);
    const [myData,setMyData]=React.useState([]);
    const [verifiedPhone,setVerifiedPhone]=React.useState(G.verifiedPhone || '');
    const [editMode,setEditMode]=React.useState(false);
    const [selected,setSelected]=React.useState(new Set());
    const [rangeStart,setRangeStart]=React.useState(null);
    const [confirm,setConfirm]=React.useState(null);
    const [loading,setLoading]=React.useState(false);
    const clearEditSelection = () => { setSelected(new Set()); setRangeStart(null); };

    const refresh = async (phone) => {
      const res=await fetch('/api/my-assignments',{headers:{'X-User-Phone':phone||verifiedPhone}});
      if (!res.ok) return null;
      const data=normalizeMyAssignments(await res.json());
      G.myAssignments=data;
      setMyData(data);
      return data;
    };

    const onVerified = (phone, data) => {
      setVerifiedPhone(phone);
      G.verifiedPhone=phone;
      G.myAssignments=data;
      setMyData(data);
      setShowVerify(false);
    };

    React.useEffect(()=>{
      if (!G.verifiedPhone) return;
      refresh(G.verifiedPhone).then(data=>{
        if (!data?.length) {
          G.verifiedPhone='';
          setVerifiedPhone('');
          setShowVerify(true);
          return;
        }
        setVerifiedPhone(G.verifiedPhone);
        setShowVerify(false);
      }).catch(()=>{});
    },[]);

    // group by masechet
    const orderIndex = new Map(MASECHOT_DATA.map((m,i)=>[m.name,i]));
    const byMasechet = {};
    myData.forEach(a=>{ if(!byMasechet[a.masechet]) byMasechet[a.masechet]=[]; byMasechet[a.masechet].push(a); });
    const sortedMas = Object.keys(byMasechet).sort((a,b)=>(orderIndex.get(a)??999)-(orderIndex.get(b)??999));

    const handlePageClick = (masechet, daf) => {
      if (!editMode) return;
      const id=`${masechet}-${daf}`;
      const ns=new Set(selected);
      if (!rangeStart) {
        setRangeStart({masechet,daf});
        if (ns.has(id)) ns.delete(id); else ns.add(id);
      } else {
        if (rangeStart.masechet===masechet) {
          const s=Math.min(rangeStart.daf,daf), en=Math.max(rangeStart.daf,daf);
          for (let d=s;d<=en;d++) ns.add(`${masechet}-${d}`);
        } else { ns.add(id); }
        setRangeStart(null);
      }
      setSelected(ns);
    };

    const markLearnedSelected = async () => {
      setLoading(true);
      for (const rec of myData) {
        if (rec.learned) continue;
        const start=rec.daf, end=rec.daf_end??rec.daf;
        const selInRange=[];
        for (let d=start;d<=end;d++) if (selected.has(`${rec.masechet}-${d}`)) selInRange.push(d);
        if (!selInRange.length) continue;
        if (selInRange.length===end-start+1) {
          await window.dataSdk.update({id:rec.id,learned:true},{authPhone:verifiedPhone,skipRefresh:true});
        } else {
          await window.dataSdk.delete({id:rec.id,authPhone:verifiedPhone});
          const allDafim=Array.from({length:end-start+1},(_,i)=>start+i);
          const selSet=new Set(selInRange);
          const newRecs=[
            ...buildDafRanges(allDafim.filter(d=>!selSet.has(d))).map(r=>({...rec,daf:r.start,daf_end:r.end,learned:false,is_full_masechet:false})),
            ...buildDafRanges(selInRange).map(r=>({...rec,daf:r.start,daf_end:r.end,learned:true,is_full_masechet:false}))
          ];
          if (newRecs.length) await window.dataSdk.createBulk(newRecs,{skipRefresh:true});
        }
      }
      await refreshAssignments();
      await refresh(verifiedPhone);
      clearEditSelection(); setEditMode(false); setLoading(false);
    };

    const deleteSelected = async () => {
      setLoading(true);
      for (const rec of myData) {
        const start=rec.daf, end=rec.daf_end??rec.daf;
        const selInRange=[];
        for (let d=start;d<=end;d++) if (selected.has(`${rec.masechet}-${d}`)) selInRange.push(d);
        if (!selInRange.length) continue;
        await window.dataSdk.delete({id:rec.id,authPhone:verifiedPhone});
        if (selInRange.length<end-start+1) {
          const allDafim=Array.from({length:end-start+1},(_,i)=>start+i);
          const selSet=new Set(selInRange);
          const newRecs=buildDafRanges(allDafim.filter(d=>!selSet.has(d))).map(r=>({...rec,daf:r.start,daf_end:r.end,is_full_masechet:false}));
          if (newRecs.length) await window.dataSdk.createBulk(newRecs,{skipRefresh:true});
        }
      }
      await refreshAssignments();
      await refresh(verifiedPhone);
      clearEditSelection(); setEditMode(false); setLoading(false);
    };

    const deleteRange = async (masechet, from, to) => {
      setLoading(true);
      const s=Math.min(from,to), en=Math.max(from,to);
      for (const rec of myData.filter(a=>a.masechet===masechet)) {
        const recStart=rec.daf, recEnd=rec.daf_end??rec.daf;
        const overlapStart=Math.max(s,recStart), overlapEnd=Math.min(en,recEnd);
        if (overlapStart>overlapEnd) continue;
        await window.dataSdk.delete({id:rec.id,authPhone:verifiedPhone});
        const allDafim=Array.from({length:recEnd-recStart+1},(_,i)=>recStart+i);
        const delSet=new Set(Array.from({length:overlapEnd-overlapStart+1},(_,i)=>overlapStart+i));
        const newRecs=buildDafRanges(allDafim.filter(d=>!delSet.has(d))).map(r=>({...rec,daf:r.start,daf_end:r.end,is_full_masechet:false}));
        if (newRecs.length) await window.dataSdk.createBulk(newRecs,{skipRefresh:true});
      }
      await refreshAssignments();
      await refresh(verifiedPhone);
      setLoading(false);
    };

    const handleAddPages = () => {
      if (!verifiedPhone || !myData.length) { showToast('אינך רשום עדיין','error'); return; }
      const firstRecord = myData[0];
      G.signupDraft = {
        name: firstRecord.name || '',
        phone: verifiedPhone,
        dedication: firstRecord.dedication || '',
      };
      navigate('shasmap', { selectionMode:true, returnTo:'mypages' });
    };

    const markRangeLearned = async (masechet, from, to) => {
      setLoading(true);
      const s=Math.min(from,to), en=Math.max(from,to);
      for (const rec of myData.filter(a=>a.masechet===masechet&&!a.learned)) {
        const recStart=rec.daf, recEnd=rec.daf_end??rec.daf;
        const overlapStart=Math.max(s,recStart), overlapEnd=Math.min(en,recEnd);
        if (overlapStart>overlapEnd) continue;
        const selInRange=Array.from({length:overlapEnd-overlapStart+1},(_,i)=>overlapStart+i);
        if (selInRange.length===recEnd-recStart+1) {
          await window.dataSdk.update({id:rec.id,learned:true},{authPhone:verifiedPhone,skipRefresh:true});
        } else {
          await window.dataSdk.delete({id:rec.id,authPhone:verifiedPhone});
          const allDafim=Array.from({length:recEnd-recStart+1},(_,i)=>recStart+i);
          const selSet=new Set(selInRange);
          const newRecs=[
            ...buildDafRanges(allDafim.filter(d=>!selSet.has(d))).map(r=>({...rec,daf:r.start,daf_end:r.end,learned:false,is_full_masechet:false})),
            ...buildDafRanges(selInRange).map(r=>({...rec,daf:r.start,daf_end:r.end,learned:true,is_full_masechet:false}))
          ];
          if (newRecs.length) await window.dataSdk.createBulk(newRecs,{skipRefresh:true});
        }
      }
      await refreshAssignments();
      await refresh(verifiedPhone);
      setLoading(false);
    };

    return (
      <div className="max-w-2xl mx-auto p-4 animate-fade-in pb-32">
        {showVerify && <PhoneVerifyModal onVerified={onVerified} onClose={()=>navigate('home')} />}

        <div className="flex justify-between items-start mb-6 gap-4">
          <button onClick={()=>navigate('home')} className="flex items-center gap-2 text-amber-400 hover:text-amber-300 transition-colors text-sm pt-1">
            <IcBack /> ראשי
          </button>
          <div className="text-center flex-1">
            <h2 className="text-2xl font-bold text-white">הדפים שלי</h2>
            <p className="text-slate-400 text-sm mt-1">מעקב ודיווח על לימוד או הוספה של דפים חדשים</p>
          </div>
          <div className="flex gap-2">
            <button onClick={handleAddPages} className="bg-amber-600 hover:bg-amber-500 text-white text-xs font-semibold px-3 py-1.5 rounded-xl transition-all">+ הוספת דפים</button>
            {!showVerify && myData.length>0 && (
              <button onClick={()=>{setEditMode(!editMode);clearEditSelection();}}
                className={`flex items-center gap-1 text-xs font-semibold px-3 py-1.5 rounded-xl border transition-all ${editMode?'bg-amber-600 border-amber-500 text-white':'bg-slate-700 border-slate-600 text-slate-300 hover:text-white'}`}>
                <IcEdit />{editMode?'סיום עריכה':'עריכת דפים'}
              </button>
            )}
          </div>
        </div>

        {!showVerify && myData.length===0 && (
          <div className="text-center text-slate-400 py-12">לא נמצאו דפים למספר זה</div>
        )}

        {!showVerify && sortedMas.map((masechet,idx)=>{
          const items=[...byMasechet[masechet]].sort((a,b)=>a.daf-b.daf);
          const uniqueDafim=[...new Set(items.map(i=>i.daf))].sort((a,b)=>a-b);
          const learnedCount=items.filter(i=>i.learned).length;
          return (
            <div key={masechet} className="bg-slate-700/50 border border-slate-600 rounded-2xl p-4 mb-4 space-y-3">
              <div className="flex justify-between items-center border-b border-slate-600 pb-3">
                <h3 className="font-bold text-amber-400 text-base">{masechet}</h3>
                <span className="text-xs text-slate-400">{learnedCount}/{items.length} נלמדו</span>
              </div>

              {/* Range controls */}
              {uniqueDafim.length > 1 && (
                <RangeControls
                  masechet={masechet}
                  uniqueDafim={uniqueDafim}
                  idx={idx}
                  onDelete={(m,from,to)=>setConfirm({type:'deleteRange',masechet:m,from,to})}
                  onMarkLearned={(m,from,to)=>setConfirm({type:'learnRange',masechet:m,from,to})}
                />
              )}

              {/* Page squares */}
              <div className="flex flex-wrap gap-1.5">
                {uniqueDafim.map(daf=>{
                  const item=items.find(i=>i.daf===daf);
                  const isLearned=item?.learned;
                  const pageId=`${masechet}-${daf}`;
                  const isSel=selected.has(pageId);
                  let cls = isLearned
                    ? 'bg-emerald-600/80 text-white border-emerald-500'
                    : 'bg-blue-600/60 text-white border-blue-500';
                  if (isSel) cls='bg-amber-500 text-white border-amber-400 ring-2 ring-amber-400 ring-offset-1 ring-offset-slate-800';
                  return (
                    <button key={daf} onClick={()=>handlePageClick(masechet,daf)}
                      disabled={!editMode}
                      className={`page-sq w-9 h-9 flex items-center justify-center rounded-lg border font-bold text-xs ${cls} ${editMode?'cursor-pointer hover:opacity-90':'cursor-default'}`}>
                      {formatDaf(daf)}
                    </button>
                  );
                })}
              </div>
            </div>
          );
        })}

        {/* Edit mode footer */}
        {editMode && (
          <div className="fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-700 p-4 shadow-2xl z-50">
            <div className="max-w-2xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-3">
              {loading ? (
                <div className="w-full flex items-center justify-center gap-3 text-amber-400 font-semibold py-1">
                  <svg className="animate-spin h-5 w-5" viewBox="0 0 24 24" fill="none"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"/><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/></svg>
                  אנא המתן…
                </div>
              ) : (
                <>
                  <div className="flex items-center gap-2 text-sm">
                    <span className="bg-amber-600 rounded-full p-1.5"><IcEdit /></span>
                    <div>
                      <div className="font-bold text-sm">מצב עריכה</div>
                      <div className="text-xs text-slate-400">בחר דף התחלה ואז דף סיום כדי לסמן טווח שלם</div>
                    </div>
                  </div>
                  <div className="flex flex-wrap gap-2 w-full sm:w-auto">
                    <button onClick={clearEditSelection} disabled={selected.size===0 && !rangeStart}
                      className="flex-1 sm:flex-none px-4 py-2 bg-slate-700 hover:bg-slate-600 disabled:opacity-40 text-white font-semibold rounded-xl text-sm transition-all">
                      נקה בחירה
                    </button>
                    <button onClick={()=>setConfirm({type:'markLearned'})} disabled={selected.size===0||loading}
                      className="flex-1 sm:flex-none px-4 py-2 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-40 text-white font-semibold rounded-xl text-sm transition-all flex items-center gap-1 justify-center">
                      <IcCheck /> סמן כנלמד
                    </button>
                    <button onClick={()=>setConfirm({type:'deleteSelected'})} disabled={selected.size===0||loading}
                      className="flex-1 sm:flex-none px-4 py-2 bg-red-600 hover:bg-red-500 disabled:opacity-40 text-white font-semibold rounded-xl text-sm transition-all flex items-center gap-1 justify-center">
                      <IcTrash /> מחיקה
                    </button>
                  </div>
                </>
              )}
            </div>
          </div>
        )}

        {/* Confirmation modals */}
        {confirm?.type==='markLearned' && (
          <ConfirmModal title="סימון כנלמד" message={`לסמן ${selected.size} דפים כנלמדו?`} confirmLabel="סמן" confirmClass="bg-emerald-600 hover:bg-emerald-500"
            onConfirm={()=>{setConfirm(null);markLearnedSelected();}} onCancel={()=>setConfirm(null)} />
        )}
        {confirm?.type==='deleteSelected' && (
          <ConfirmModal title="מחיקת שיבוץ" message={`למחוק ${selected.size} דפים?`}
            onConfirm={()=>{setConfirm(null);deleteSelected();}} onCancel={()=>setConfirm(null)} />
        )}
        {confirm?.type==='deleteRange' && (
          <ConfirmModal title="מחיקת טווח" message={`למחוק במסכת ${confirm.masechet} דפים ${formatDaf(confirm.from)}-${formatDaf(confirm.to)}?`}
            onConfirm={()=>{setConfirm(null);deleteRange(confirm.masechet,confirm.from,confirm.to);}} onCancel={()=>setConfirm(null)} />
        )}
        {confirm?.type==='learnRange' && (
          <ConfirmModal title="סימון טווח כנלמד" message={`לסמן במסכת ${confirm.masechet} דפים ${formatDaf(confirm.from)}-${formatDaf(confirm.to)} כנלמד?`}
            confirmLabel="סמן" confirmClass="bg-emerald-600 hover:bg-emerald-500"
            onConfirm={()=>{setConfirm(null);markRangeLearned(confirm.masechet,confirm.from,confirm.to);}} onCancel={()=>setConfirm(null)} />
        )}
      </div>
    );
  };

  // Range controls sub-component
  const RangeControls = ({ masechet, uniqueDafim, idx, onDelete, onMarkLearned }) => {
    const [from,setFrom]=React.useState(uniqueDafim[0]);
    const [to,setTo]=React.useState(uniqueDafim[uniqueDafim.length-1]);
    React.useEffect(()=>{ setFrom(uniqueDafim[0]); setTo(uniqueDafim[uniqueDafim.length-1]); },[masechet]);
    const opts = uniqueDafim.map(d=><option key={d} value={d}>{formatDaf(d)}</option>);
    const selClass="bg-slate-700 border border-slate-600 rounded-lg px-2 py-1 text-white text-xs focus:border-amber-500 focus:outline-none";
    return (
      <div className="flex flex-wrap items-center gap-2 text-xs text-slate-300 bg-slate-800/50 rounded-xl px-3 py-2">
        <span className="text-slate-400">טווח:</span>
        <select value={from} onChange={e=>setFrom(parseInt(e.target.value))} className={selClass}>{opts}</select>
        <span>עד</span>
        <select value={to} onChange={e=>setTo(parseInt(e.target.value))} className={selClass}>{opts}</select>
        <button onClick={()=>onDelete(masechet,from,to)} className="px-2 py-1 bg-red-600/70 hover:bg-red-600 text-white rounded-lg transition-all">מחק</button>
        <button onClick={()=>onMarkLearned(masechet,from,to)} className="px-2 py-1 bg-emerald-600/80 hover:bg-emerald-500 text-white rounded-lg transition-all">סמן כנלמד</button>
      </div>
    );
  };

  // ─── APP ROOT ─────────────────────────────────────────────────────────────────
  const App = () => {
    const [viewState,setViewState]=React.useState({ name:'home', selectionMode:false });
    const [assignments,setAssignments]=React.useState([]);
    const [config,setConfig]=React.useState({...defaultConfig});
    const totalAssigned = assignments.length;
    const totalLearned = assignments.filter(a=>a.learned).length;

    React.useEffect(()=>{
      G.onDataChanged = () => setAssignments([...G.assignments]);
      window.dataSdk.init().then(r=>{ if(!r.isOk) console.error('init failed'); });
      fetch('/api/config').then(r=>r.ok?r.json():null).then(d=>{ if(d) setConfig(c=>({...c,...d})); }).catch(()=>{});
    },[]);

    const navigate = (name, extras={}) => { setViewState({ name, ...extras }); window.scrollTo(0,0); };

    return (
      <div className="min-h-screen bg-gradient-to-b from-slate-900 to-slate-800">
        <Header config={config} navigate={navigate} />
        {viewState.name==='home' && <Dashboard navigate={navigate} assignments={assignments} totalAssigned={totalAssigned} totalLearned={totalLearned} />}
        {viewState.name==='shasmap' && <ShasMapView navigate={navigate} assignments={assignments} selectionMode={Boolean(viewState.selectionMode)} returnTo={viewState.returnTo || 'home'} />}
        {viewState.name==='mypages' && <MyPagesView navigate={navigate} />}
      </div>
    );
  };

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

  <div id="toast-container" class="fixed top-4 left-0 right-0 z-[60] flex flex-col items-center gap-2 pointer-events-none px-4"></div>
</body>
</html>
