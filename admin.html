<!DOCTYPE html>
<html lang="he" dir="rtl" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מסיימים ש״ס יחד אחים</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html { height: 100%; }
    body { box-sizing: border-box; height: 100%; }
    * { font-family: 'Heebo', sans-serif; }
    .pixel { width: 2px; height: 2px; border-radius: 0; }
    .masechet-card:hover { transform: translateY(-2px); }
    .daf-cell { 
      width: 36px; 
      height: 36px; 
      font-size: 11px;
      transition: all 0.15s ease;
    }
    .daf-cell:hover { transform: scale(1.1); z-index: 10; }
    .modal-backdrop { background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); }
    .toast { animation: slideIn 0.3s ease, fadeOut 0.3s ease 2.7s; }
    @keyframes slideIn { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes fadeOut { to { opacity: 0; } }
  </style>
</head>
<body class="h-full bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 text-white overflow-auto">

  <div id="app" class="w-full h-full">
    <!-- Toast Container -->
    <div id="toast-container" class="fixed top-4 left-4 right-4 z-[60] flex flex-col gap-2"></div>
    <!-- Wait Overlay -->
    <div id="wait-overlay" style="display:none" class="fixed inset-0 bg-slate-900/70 z-[70] flex items-center justify-center">
      <div class="bg-slate-800 border border-slate-600 rounded-2xl px-8 py-6 flex items-center gap-4 shadow-2xl">
        <svg class="animate-spin h-6 w-6 text-amber-400 shrink-0" viewBox="0 0 24 24" fill="none"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/></svg>
        <span class="text-white font-semibold text-base">אנא המתן…</span>
      </div>
    </div>

    <!-- Header -->
    <header class="bg-gradient-to-r from-amber-600 to-amber-700 shadow-lg sticky top-0 z-40">
      <div id="countdown-banner" class="border-b border-amber-500/40 bg-amber-700/40">
        <div class="max-w-4xl mx-auto px-4 py-2 flex items-center justify-between gap-3 text-xs sm:text-sm">
          <div class="flex flex-wrap items-center gap-2 text-amber-100">
            <span class="font-semibold">ימים לסיום:</span>
            <div class="flex flex-wrap items-center gap-2">
              <div class="flex items-center gap-1 bg-slate-900/30 px-2 py-1 rounded-lg">
                <span id="countdown-days" class="font-bold text-white">0</span>
                <span>ימים</span>
              </div>
              <div class="flex items-center gap-1 bg-slate-900/30 px-2 py-1 rounded-lg">
                <span id="countdown-hours" class="font-bold text-white">00</span>
                <span>שעות</span>
              </div>
              <div class="flex items-center gap-1 bg-slate-900/30 px-2 py-1 rounded-lg">
                <span id="countdown-minutes" class="font-bold text-white">00</span>
                <span>דקות</span>
              </div>
              <div class="flex items-center gap-1 bg-slate-900/30 px-2 py-1 rounded-lg">
                <span id="countdown-seconds" class="font-bold text-white">00</span>
                <span>שניות</span>
              </div>
            </div>
          </div>
          <button type="button" onclick="closeCountdownBanner()" class="text-amber-100 hover:text-white transition-colors" aria-label="סגור">✕</button>
        </div>
      </div>
      <div class="max-w-4xl mx-auto px-4 py-4">
        <div class="flex flex-col items-center gap-2">
          <div class="flex items-center justify-center gap-3">
            <img src="/יחד אחים.png" alt="יחד אחים" class="h-10 w-10 object-contain drop-shadow-md">
            <h1 id="main-title" class="text-2xl font-bold text-center">מסיימים ש״ס יחד אחים</h1>
          </div>
          <p id="main-subtitle" class="text-amber-100 text-center text-sm">השלמת הש״ס</p>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main id="main-content" class="max-w-4xl mx-auto px-4 py-6">
      <!-- Home Screen -->
      <div id="home-screen">
        <!-- Stats Cards -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">
          <div class="bg-slate-700/50 rounded-xl p-4 text-center border border-slate-600">
            <div id="stat-total" class="text-2xl font-bold text-amber-400">2,711</div>
            <div class="text-xs text-slate-400">סה״כ דפים</div>
          </div>
          <div class="bg-slate-700/50 rounded-xl p-4 text-center border border-slate-600">
            <div id="stat-assigned" class="text-2xl font-bold text-blue-400">0</div>
            <div class="text-xs text-slate-400">שובצו</div>
          </div>
          <div class="bg-slate-700/50 rounded-xl p-4 text-center border border-slate-600">
            <div id="stat-learned" class="text-2xl font-bold text-emerald-400">0</div>
            <div class="text-xs text-slate-400">נלמדו</div>
          </div>
        </div>

        <!-- Progress Bar -->
        <div class="bg-slate-700/50 rounded-xl p-4 mb-6 border border-slate-600">
          <div class="flex justify-between text-sm mb-2">
            <span class="text-slate-300">התקדמות כללית</span>
            <span id="progress-percent" class="text-amber-400 font-semibold">0%</span>
          </div>
          <div class="h-3 bg-slate-600 rounded-full overflow-hidden">
            <div id="progress-bar" class="h-full bg-gradient-to-r from-amber-500 to-emerald-500 transition-all duration-500" style="width: 0%"></div>
          </div>
        </div>

        <!-- Pixel Map -->
        <div class="bg-slate-700/50 rounded-xl p-4 mb-6 border border-slate-600">
          <h3 class="text-sm font-semibold mb-3 text-slate-300">מפת הש״ס</h3>
          <div id="pixel-map" class="flex flex-wrap gap-px justify-center"></div>
          <div class="flex justify-center gap-4 mt-3 text-xs">
            <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-slate-500"></span> פנוי</span>
            <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-blue-500"></span> משובץ</span>
            <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-emerald-500"></span> נלמד</span>
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="grid grid-cols-3 gap-3 mb-6">
          <button onclick="openAutoAssign()" class="bg-gradient-to-r from-purple-600 to-purple-700 hover:from-purple-500 hover:to-purple-600 text-white font-semibold py-4 px-4 rounded-xl transition-all shadow-lg flex flex-col items-center gap-1">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
            <span class="text-sm">שבץ אותי</span>
          </button>
          <button onclick="openRangeAssign()" class="bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-500 hover:to-blue-600 text-white font-semibold py-4 px-4 rounded-xl transition-all shadow-lg flex flex-col items-center gap-1">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
            <span class="text-sm">שיבוץ טווח</span>
          </button>
          <button onclick="openMyPages()" class="bg-gradient-to-r from-emerald-600 to-emerald-700 hover:from-emerald-500 hover:to-emerald-600 text-white font-semibold py-4 px-4 rounded-xl transition-all shadow-lg flex flex-col items-center gap-1">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            <span class="text-sm">הדפים שלי</span>
          </button>
          <button onclick="openAllLearners()" class="bg-gradient-to-r from-rose-600 to-rose-700 hover:from-rose-500 hover:to-rose-600 text-white font-semibold py-4 px-4 rounded-xl transition-all shadow-lg flex flex-col items-center gap-1">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5V4H2v16h5m10 0v-2a4 4 0 00-8 0v2m8 0H9m4-9a3 3 0 110-6 3 3 0 010 6z"/></svg>
            <span class="text-sm">כל הלומדים</span>
          </button>
        </div>

        <!-- Masechot List -->
        <h3 class="text-lg font-semibold mb-3 text-slate-300">מסכתות</h3>
        <div id="masechot-list" class="space-y-2"></div>
      </div>

      <!-- Masechet Screen (hidden by default) -->
      <div id="masechet-screen" class="hidden">
        <button onclick="goHome()" class="flex items-center gap-2 text-amber-400 mb-4 hover:text-amber-300 transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
          חזרה לרשימה
        </button>
        
        <div class="bg-slate-700/50 rounded-xl p-4 mb-4 border border-slate-600">
          <h2 id="masechet-title" class="text-xl font-bold text-amber-400 mb-2"></h2>
          <div class="flex gap-4 text-sm">
            <span id="masechet-free" class="text-slate-400"></span>
            <span id="masechet-assigned" class="text-blue-400"></span>
            <span id="masechet-learned" class="text-emerald-400"></span>
          </div>
          <div class="h-2 bg-slate-600 rounded-full overflow-hidden mt-3">
            <div id="masechet-progress" class="h-full bg-gradient-to-r from-blue-500 to-emerald-500 transition-all duration-300" style="width: 0%"></div>
          </div>
        </div>

        <div id="daf-grid" class="grid grid-cols-7 sm:grid-cols-10 gap-1"></div>
      </div>

      <!-- My Pages Screen (hidden by default) -->
      <div id="my-pages-screen" class="hidden">
        <button onclick="goHome()" class="flex items-center gap-2 text-amber-400 mb-4 hover:text-amber-300 transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
          חזרה לרשימה
        </button>

        <div class="bg-slate-700/50 rounded-xl p-4 mb-4 border border-slate-600">
          <h2 class="text-xl font-bold text-amber-400 mb-3">בחר שם לצפייה בדפים</h2>
          <select id="names-select" onchange="handleMyPagesNameSelection()" class="w-full bg-slate-700 border border-slate-600 rounded-xl px-4 py-3 text-white focus:border-amber-500 focus:outline-none">
            <option value="">-- בחר שם --</option>
          </select>
          <div id="my-pages-phone-verification" class="hidden mt-3 space-y-2">
            <label for="my-pages-phone" class="block text-sm font-medium text-slate-300">אימות טלפון *</label>
            <div class="flex gap-2">
              <input type="tel" id="my-pages-phone" inputmode="numeric" placeholder="הזן מספר טלפון"
                class="flex-1 bg-slate-700 border border-slate-600 rounded-xl px-4 py-3 text-white focus:border-amber-500 focus:outline-none">
              <button type="button" onclick="verifyMyPagesPhone()" class="bg-amber-600 hover:bg-amber-500 text-white font-semibold px-4 rounded-xl transition-all">
                אמת
              </button>
            </div>
            <p class="text-xs text-slate-400">יש להזין את מספר הטלפון של המשתמש כדי לצפות ולערוך.</p>
          </div>
        </div>

        <div id="my-pages-content" class="space-y-4"></div>
      </div>

      <!-- All Learners Screen (admin) -->
      <div id="all-learners-screen" class="hidden">
        <button onclick="goHome()" class="flex items-center gap-2 text-amber-400 mb-4 hover:text-amber-300 transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
          חזרה לרשימה
        </button>
        <div class="bg-slate-700/50 rounded-xl p-4 mb-4 border border-slate-600">
          <h2 class="text-xl font-bold text-amber-400 mb-3">כל הלומדים</h2>
          <select id="all-learners-select" onchange="handleAllLearnersSelection()" class="w-full bg-slate-700 border border-slate-600 rounded-xl px-4 py-3 text-white focus:border-amber-500 focus:outline-none">
            <option value="">-- בחר לומד --</option>
          </select>
        </div>
        <div id="all-learners-content" class="space-y-4"></div>
      </div>
    </main>

    <!-- Modals -->
    <div id="modal-container"></div>
  </div>

  <script>
    // ========== DATA & CONFIG ==========
    const MASECHOT_DATA = [
      { seder: "זרעים", name: "ברכות", dafim: 63 },
      { seder: "מועד", name: "שבת", dafim: 156 },
      { seder: "מועד", name: "עירובין", dafim: 104 },
      { seder: "מועד", name: "פסחים", dafim: 120 },
      { seder: "מועד", name: "יומא", dafim: 87 },
      { seder: "מועד", name: "סוכה", dafim: 55 },
      { seder: "מועד", name: "ביצה", dafim: 39 },
      { seder: "מועד", name: "ראש השנה", dafim: 34 },
      { seder: "מועד", name: "תענית", dafim: 30 },
      { seder: "מועד", name: "מגילה", dafim: 31 },
      { seder: "מועד", name: "מועד קטן", dafim: 28 },
      { seder: "מועד", name: "חגיגה", dafim: 27 },
      { seder: "מועד", name: "שקלים", dafim: 21 },
      { seder: "נשים", name: "יבמות", dafim: 121 },
      { seder: "נשים", name: "כתובות", dafim: 111 },
      { seder: "נשים", name: "נדרים", dafim: 91 },
      { seder: "נשים", name: "נזיר", dafim: 66 },
      { seder: "נשים", name: "סוטה", dafim: 49 },
      { seder: "נשים", name: "גיטין", dafim: 90 },
      { seder: "נשים", name: "קידושין", dafim: 82 },
      { seder: "נזיקין", name: "בבא קמא", dafim: 119 },
      { seder: "נזיקין", name: "בבא מציעא", dafim: 119 },
      { seder: "נזיקין", name: "בבא בתרא", dafim: 176 },
      { seder: "נזיקין", name: "סנהדרין", dafim: 113 },
      { seder: "נזיקין", name: "מכות", dafim: 24 },
      { seder: "נזיקין", name: "שבועות", dafim: 49 },
      { seder: "נזיקין", name: "עבודה זרה", dafim: 76 },
      { seder: "נזיקין", name: "הוריות", dafim: 14 },
      { seder: "קדשים", name: "זבחים", dafim: 120 },
      { seder: "קדשים", name: "מנחות", dafim: 110 },
      { seder: "קדשים", name: "חולין", dafim: 142 },
      { seder: "קדשים", name: "בכורות", dafim: 61 },
      { seder: "קדשים", name: "ערכין", dafim: 34 },
      { seder: "קדשים", name: "תמורה", dafim: 34 },
      { seder: "קדשים", name: "כריתות", dafim: 28 },
      { seder: "קדשים", name: "מעילה", dafim: 22 },
      { seder: "קדשים", name: "תמיד", dafim: 9 },
      { seder: "קדשים", name: "מדות", dafim: 4 },
      { seder: "קדשים", name: "קנים", dafim: 4 },
      { seder: "טהרות", name: "נדה", dafim: 73 }
    ];

    const TOTAL_DAFIM = 2711;

    let assignmentRanges = [];
    let assignments = [];
    let currentMasechet = null;
    let verifiedMyPagesUser = null;
    let selectedAllLearnersKey = null;

    const defaultConfig = {
      site_title: "מסיימים ש״ס יחד אחים",
      site_subtitle: "השלמת הש״ס"
    };

    let config = { ...defaultConfig };

    // ========== HELPER FUNCTIONS ==========
    function getAssignment(masechet, daf) {
      return assignments.find(a => a.masechet === masechet && a.daf === daf);
    }

    function getDafStatus(masechet, daf) {
      const assignment = getAssignment(masechet, daf);
      if (!assignment) return 'free';
      return assignment.learned ? 'learned' : 'assigned';
    }

    function getStatusColor(status) {
      switch(status) {
        case 'free': return 'bg-slate-500';
        case 'assigned': return 'bg-blue-500';
        case 'learned': return 'bg-emerald-500';
      }
    }

    function formatDafNumber(num) {
      const letters = ['', 'א', 'ב', 'ג', 'ד', 'ה', 'ו', 'ז', 'ח', 'ט', 'י', 'יא', 'יב', 'יג', 'יד', 'טו', 'טז', 'יז', 'יח', 'יט', 'כ', 'כא', 'כב', 'כג', 'כד', 'כה', 'כו', 'כז', 'כח', 'כט', 'ל', 'לא', 'לב', 'לג', 'לד', 'לה', 'לו', 'לז', 'לח', 'לט', 'מ', 'מא', 'מב', 'מג', 'מד', 'מה', 'מו', 'מז', 'מח', 'מט', 'נ', 'נא', 'נב', 'נג', 'נד', 'נה', 'נו', 'נז', 'נח', 'נט', 'ס', 'סא', 'סב', 'סג', 'סד', 'סה', 'סו', 'סז', 'סח', 'סט', 'ע', 'עא', 'עב', 'עג', 'עד', 'עה', 'עו', 'עז', 'עח', 'עט', 'פ', 'פא', 'פב', 'פג', 'פד', 'פה', 'פו', 'פז', 'פח', 'פט', 'צ', 'צא', 'צב', 'צג', 'צד', 'צה', 'צו', 'צז', 'צח', 'צט', 'ק', 'קא', 'קב', 'קג', 'קד', 'קה', 'קו', 'קז', 'קח', 'קט', 'קי', 'קיא', 'קיב', 'קיג', 'קיד', 'קטו', 'קטז', 'קיז', 'קיח', 'קיט', 'קכ', 'קכא', 'קכב', 'קכג', 'קכד', 'קכה', 'קכו', 'קכז', 'קכח', 'קכט', 'קל', 'קלא', 'קלב', 'קלג', 'קלד', 'קלה', 'קלו', 'קלז', 'קלח', 'קלט', 'קם', 'קמא', 'קמב', 'קמג', 'קמד', 'קמה', 'קמו', 'קמז', 'קמח', 'קמט', 'קנ', 'קנא', 'קנב', 'קנג', 'קנד', 'קנה', 'קנו', 'קנז', 'קנח', 'קנט', 'קס', 'קסא', 'קסב', 'קסג', 'קסד', 'קסה', 'קסו', 'קסז', 'קסח', 'קסט', 'קע', 'קעא', 'קעב', 'קעג', 'קעד', 'קעה', 'קעו'];
      return letters[num] || num.toString();
    }

    function normalizePhone(value) {
      return String(value || '').replace(/\D/g, '');
    }

    function isValidPhone(phone) {
      return /^\d{9,15}$/.test(phone);
    }

    function findExistingUserByPhone(phone) {
      if (!phone) return null;
      return assignmentRanges.find(a => normalizePhone(a.phone) === phone) || null;
    }

    function openPhoneConflictModal(existingName, enteredName) {
      return new Promise(resolve => {
        showModal(`
          <div class="p-6">
            <h3 class="text-lg font-bold text-amber-400 mb-3">מספר טלפון כבר קיים</h3>
            <p class="text-slate-300 text-sm mb-4">
              מספר הטלפון כבר משויך ל-${existingName}. ניתן להשתמש בפרטים הקיימים או להזין מספר אחר.
            </p>
            <div class="space-y-2">
              <button id="use-existing-phone-btn" type="button" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 px-4 rounded-xl transition-all">
                השתמש בפרטים הקיימים
              </button>
              <button id="use-different-phone-btn" type="button" class="w-full bg-slate-600 hover:bg-slate-500 text-white font-semibold py-3 px-4 rounded-xl transition-all">
                הזן מספר אחר
              </button>
            </div>
            ${enteredName && enteredName !== existingName ? `<p class="text-xs text-slate-400 mt-3">השם שהוזן (${enteredName}) לא יישמר אם תבחר בפרטים הקיימים.</p>` : ''}
          </div>
        `);
        document.getElementById('use-existing-phone-btn').onclick = () => {
          closeModal({ target: {}, currentTarget: {} });
          resolve('use_existing');
        };
        document.getElementById('use-different-phone-btn').onclick = () => {
          closeModal({ target: {}, currentTarget: {} });
          resolve('use_different');
        };
      });
    }

    async function resolveSignupIdentity(name, rawPhone, dedication = '') {
      const normalizedPhone = normalizePhone(rawPhone);
      if (!name) {
        showToast('אנא הזן שם', 'error');
        return null;
      }
      if (!isValidPhone(normalizedPhone)) {
        showToast('אנא הזן מספר טלפון תקין', 'error');
        return null;
      }
      const existing = findExistingUserByPhone(normalizedPhone);
      if (!existing) {
        return { name, phone: normalizedPhone, dedication };
      }
      if (existing.name === name) {
        return { name: existing.name, phone: normalizedPhone, dedication };
      }
      const choice = await openPhoneConflictModal(existing.name, name);
      if (choice !== 'use_existing') {

      return {

    function formatIcsDate(date) {
      const year = date.getFullYear();
      const month = `${date.getMonth() + 1}`.padStart(2, '0');
      const day = `${date.getDate()}`.padStart(2, '0');
      return `${year}${month}${day}`;
    }

    function getRangeEnd(record) {
      return record.daf_end ?? record.daf;
    }

    function expandAssignments(records) {
      const expanded = [];
      records.forEach(record => {
        const start = record.daf;
        const end = getRangeEnd(record);
        for (let daf = start; daf <= end; daf += 1) {
          expanded.push({
            ...record,
            daf,
            range_start: start,
            range_end: end
          });
        }
      });
      return expanded;
    }

    function buildDafRanges(dafNumbers) {
      if (!dafNumbers.length) return [];
      const ranges = [];
      let start = dafNumbers[0];
      let previous = dafNumbers[0];
      for (let i = 1; i < dafNumbers.length; i += 1) {
        const current = dafNumbers[i];
        if (current === previous + 1) {
          previous = current;
          continue;
        }
        ranges.push({ start, end: previous });
        start = current;
        previous = current;
      }
      ranges.push({ start, end: previous });
      return ranges;
    }

    function formatRanges(ranges) {
      return ranges.map(range => {
        if (range.start === range.end) {
          return formatDafNumber(range.start);
        }
        return `${formatDafNumber(range.start)}-${formatDafNumber(range.end)}`;
      }).join(', ');
    }

    function buildAssignmentDetails(assignmentsList) {
      const grouped = {};
      assignmentsList.forEach(item => {
        if (!grouped[item.masechet]) {
          grouped[item.masechet] = [];
        }
        const start = item.daf;
        const end = getRangeEnd(item);
        for (let daf = start; daf <= end; daf += 1) {
          grouped[item.masechet].push(daf);
        }
      });
      const lines = Object.entries(grouped).map(([masechet, dafs]) => {
        const unique = [...new Set(dafs)].sort((a, b) => a - b);
        const ranges = buildDafRanges(unique);
        return `מסכת ${masechet} דפים ${formatRanges(ranges)}`;
      });
      return {
        lines,
        html: lines.map(line => `<div>${line}</div>`).join(''),
        text: lines.join('\n')
      };
    }

    function getUserGroups() {
      const groups = new Map();
      assignmentRanges.forEach(record => {
        const phone = normalizePhone(record.phone);
        const key = phone ? `phone:${phone}` : `name:${record.name}`;
        const current = groups.get(key);
        if (!current) {
          groups.set(key, {
            key,
            name: record.name,
            phone: phone || '',
            dedication: record.dedication || '',
            records: [record]
          });
          return;
        }
        current.records.push(record);
        if (!current.phone && phone) {
          current.phone = phone;
        }
        if (!current.dedication && record.dedication) {
          current.dedication = record.dedication;
        }
      });
      return [...groups.values()].sort((a, b) => a.name.localeCompare(b.name, 'he'));
    }

    function updateCountdown() {
      const now = new Date();
      let diff = COUNTDOWN_TARGET - now;
      if (diff < 0) diff = 0;
      const totalSeconds = Math.floor(diff / 1000);
      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      const daysEl = document.getElementById('countdown-days');
      const hoursEl = document.getElementById('countdown-hours');
      const minutesEl = document.getElementById('countdown-minutes');
      const secondsEl = document.getElementById('countdown-seconds');
      if (daysEl) daysEl.textContent = days.toLocaleString();
      if (hoursEl) hoursEl.textContent = padCountdown(hours);
      if (minutesEl) minutesEl.textContent = padCountdown(minutes);
      if (secondsEl) secondsEl.textContent = padCountdown(seconds);
    }

    async function saveAllLearnerDetails() {
      const user = getUserByKey(selectedAllLearnersKey);
      if (!user) return;
      const name = document.getElementById('all-learner-name')?.value.trim();
      const phone = normalizePhone(document.getElementById('all-learner-phone')?.value);
      const dedication = document.getElementById('all-learner-dedication')?.value.trim();
      if (!name) {
        showToast('יש להזין שם', 'error');
        return;
      }
      if (phone && !isValidPhone(phone)) {
        showToast('אנא הזן מספר טלפון תקין', 'error');
        return;
      }
      const nextDedication = dedication || '';
      const changedRecords = user.records.filter(record => {
        return record.name !== name
          || normalizePhone(record.phone) !== phone
          || (record.dedication || '') !== nextDedication;
      });
      if (!changedRecords.length) {
        showToast('לא זוהו שינויים', 'info');
        return;
      }
      const results = await Promise.all(changedRecords.map(record => window.dataSdk.update({
          id: record.id,
          masechet: record.masechet,
          daf: record.daf,
          daf_end: record.daf_end ?? record.daf,
          name,
          phone,
          dedication: nextDedication,
          learned: record.learned,
          is_full_masechet: record.is_full_masechet
        }, { skipRefresh: true })));
      if (results.some(result => !result.isOk)) {
        showToast('שגיאה בעדכון פרטים', 'error');
        return;
      }
      await refreshAssignments();
      const refreshed = getUserGroups().find(group => group.records.some(record => user.records.some(old => old.id === record.id)));
      selectedAllLearnersKey = refreshed?.key || selectedAllLearnersKey;
      renderAllLearnersSelect();
      renderAllLearnersView();
      showActionDoneModal('פרטי ההרשמה עודכנו.');
    }

    function getFreeDafimByMasechet(masechet) {
      const mas = MASECHOT_DATA.find(item => item.name === masechet);
      if (!mas) return [];
      const free = [];
      for (let daf = 2; daf <= mas.dafim + 1; daf += 1) {
        if (!getAssignment(masechet, daf)) {
          free.push(daf);
        }
      }
      return free;
    }

    async function quickAddForAllLearner() {
      const user = getUserByKey(selectedAllLearnersKey);
      if (!user) return;
      if (!user.phone || !isValidPhone(user.phone)) {
        showToast('יש להשלים מספר טלפון תקין בפרטי הלומד לפני הוספת דפים', 'error');
        return;
      }
      const masechet = document.getElementById('all-quick-masechet')?.value;
      const fromDaf = parseInt(document.getElementById('all-quick-from')?.value);
      const toDaf = parseInt(document.getElementById('all-quick-to')?.value);
      if (!masechet || Number.isNaN(fromDaf) || Number.isNaN(toDaf)) {
        showToast('יש לבחור מסכת וטווח דפים להוספה', 'error');
        return;
      }
      const start = Math.min(fromDaf, toDaf);
      const end = Math.max(fromDaf, toDaf);
      const dafim = [];
      for (let daf = start; daf <= end; daf += 1) {
        if (!getAssignment(masechet, daf)) {
          dafim.push(daf);
        }
      }
      if (!dafim.length) {
        showToast('הדפים שנבחרו כבר תפוסים', 'error');
        return;
      }
      const ranges = buildDafRanges(dafim);
      const records = ranges.map(range => ({
        masechet,
        daf: range.start,
        daf_end: range.end,
        name: user.name,
        phone: user.phone || '',
        dedication: user.dedication || '',
        learned: false,
        is_full_masechet: false
      }));
      const result = await window.dataSdk.createBulk(records);
      if (!result.isOk) {
        showToast('שגיאה בהוספה', 'error');
        return;
      }
      await refreshAssignments();
      renderAllLearnersSelect();
      renderAllLearnersView();
      showActionDoneModal('הדפים נוספו בהצלחה.');
    }

    async function runAllLearnerMasechetRangeAction(userKey, masechet, rangeFromSelectId, rangeToSelectId, actionSelectId) {
      const user = getUserByKey(userKey);
      if (!user) {
        showToast('הלומד לא נמצא', 'error');
        return;
      }
      const fromDaf = parseInt(document.getElementById(rangeFromSelectId)?.value);
      const toDaf = parseInt(document.getElementById(rangeToSelectId)?.value);
      const action = document.getElementById(actionSelectId)?.value;
      if (Number.isNaN(fromDaf) || Number.isNaN(toDaf) || !action) {
        showToast('יש לבחור טווח ופעולה', 'error');
        return;
      }
      const rangeStart = Math.min(fromDaf, toDaf);
      const rangeEnd = Math.max(fromDaf, toDaf);
      const userRecordIds = new Set(user.records.map(record => record.id));

      // Operate on raw range records rather than expanded dafim to avoid split-ID issues
      const overlappingRecords = assignmentRanges.filter(record =>
        userRecordIds.has(record.id)
        && record.masechet === masechet
        && record.daf <= rangeEnd
        && (record.daf_end ?? record.daf) >= rangeStart
      );
      if (!overlappingRecords.length) {
        showToast('אין דפים בטווח שנבחר', 'error');
        return;
      }

      showWaitOverlay(true);

      if (action === 'learned') {
        let updated = false;
        for (const rec of overlappingRecords) {
          if (rec.learned) continue;
          const recStart = rec.daf, recEnd = rec.daf_end ?? rec.daf;
          const overlapStart = Math.max(rangeStart, recStart), overlapEnd = Math.min(rangeEnd, recEnd);
          if (overlapStart > overlapEnd) continue;
          if (overlapStart === recStart && overlapEnd === recEnd) {
            const result = await window.dataSdk.update({ id: rec.id, learned: true }, { skipRefresh: true });
            if (!result.isOk) { showWaitOverlay(false); showToast('שגיאה בעדכון', 'error'); return; }
          } else {
            const result = await window.dataSdk.delete({ id: rec.id }, { skipRefresh: true });
            if (!result.isOk) { showWaitOverlay(false); showToast('שגיאה במחיקה', 'error'); return; }
            const allDafim = Array.from({ length: recEnd - recStart + 1 }, (_, i) => recStart + i);
            const overlapSet = new Set(Array.from({ length: overlapEnd - overlapStart + 1 }, (_, i) => overlapStart + i));
            const newRecs = [
              ...buildDafRanges(allDafim.filter(d => !overlapSet.has(d))).map(r => ({ ...rec, daf: r.start, daf_end: r.end, learned: false, is_full_masechet: false })),
              ...buildDafRanges([...overlapSet]).map(r => ({ ...rec, daf: r.start, daf_end: r.end, learned: true, is_full_masechet: false }))
            ];
            if (newRecs.length) {
              const createResult = await window.dataSdk.createBulk(newRecs, { skipRefresh: true });
              if (!createResult.isOk) { showWaitOverlay(false); showToast('שגיאה ביצירה', 'error'); return; }
            }
          }
          updated = true;
        }
        showWaitOverlay(false);
        if (!updated) { showToast('כל הדפים בטווח כבר מסומנים כנלמד', 'info'); return; }
        await refreshAssignments();
        renderAllLearnersSelect();
        renderAllLearnersView();
        showActionDoneModal('הדפים סומנו כנלמד.');
        return;
      }

      if (action === 'delete') {
        for (const rec of overlappingRecords) {
          const recStart = rec.daf, recEnd = rec.daf_end ?? rec.daf;
          const overlapStart = Math.max(rangeStart, recStart), overlapEnd = Math.min(rangeEnd, recEnd);
          if (overlapStart > overlapEnd) continue;
          const result = await window.dataSdk.delete({ id: rec.id }, { skipRefresh: true });
          if (!result.isOk) { showWaitOverlay(false); showToast('שגיאה במחיקה', 'error'); return; }
          const allDafim = Array.from({ length: recEnd - recStart + 1 }, (_, i) => recStart + i);
          const delSet = new Set(Array.from({ length: overlapEnd - overlapStart + 1 }, (_, i) => overlapStart + i));
          const remaining = buildDafRanges(allDafim.filter(d => !delSet.has(d))).map(r => ({ ...rec, daf: r.start, daf_end: r.end, is_full_masechet: false }));
          if (remaining.length) {
            const createResult = await window.dataSdk.createBulk(remaining, { skipRefresh: true });
            if (!createResult.isOk) { showWaitOverlay(false); showToast('שגיאה ביצירה', 'error'); return; }
          }
        }
        showWaitOverlay(false);
        await refreshAssignments();
        renderAllLearnersSelect();
        renderAllLearnersView();
        showActionDoneModal('הדפים נמחקו.');
        return;
      }

      showWaitOverlay(false);
      showToast('פעולה לא נתמכת', 'error');
    }

    async function processFullMasechet() {
      const name = document.getElementById('full-name').value.trim();
      const phone = document.getElementById('full-phone').value.trim();

      const dedication = document.getElementById('full-dedication').value.trim();
      
      const identity = await resolveSignupIdentity(name, phone, dedication);
      if (!identity) {
        return;
      }
      
      const mas = MASECHOT_DATA.find(m => m.name === masechet);
      if (!mas) return;
      
      // Check if masechet already assigned
      const existingFull = assignments.find(a => a.masechet === masechet && a.is_full_masechet);
      if (existingFull) {
        showToast('מסכת זו כבר הוקצתה', 'error');
        return;
      }
      
      showModal(`
        <div class="p-6 text-center">
          <div class="animate-spin w-12 h-12 border-4 border-amber-500 border-t-transparent rounded-full mx-auto mb-4"></div>
          <p class="text-slate-300">משבץ ${mas.dafim} דפים של מסכת ${mas.name}...</p>
        </div>
      `);
      
      const record = {
        masechet: masechet,
        daf: 2,
        daf_end: mas.dafim + 1,
        name: identity.name,
        phone: identity.phone,
        dedication: identity.dedication,
        learned: false,
        is_full_masechet: true
      };
      const result = await window.dataSdk.create(record, { skipRefresh: true });
      if (result.isOk) {
        await refreshAssignments();
        showAssignmentSuccess(identity.name, [record]);
      } else {
        closeModal({ target: {}, currentTarget: {} });
        showToast('שגיאה בשיבוץ', 'error');
      }
    }

    async function processAutoAssign() {
      const name = document.getElementById('auto-name').value.trim();
      const phone = document.getElementById('auto-phone').value.trim();
      const count = parseInt(document.getElementById('auto-count').value) || 1;
      const dedication = document.getElementById('auto-dedication').value.trim();
      
      const identity = await resolveSignupIdentity(name, phone, dedication);
      if (!identity) return;
      
      // Find free dafim with priority to fill gaps
      const freeDafim = [];
      
      // First priority: masechot that are partially done
      const partialMasechot = MASECHOT_DATA.filter(mas => {
        const masAssignments = assignments.filter(a => a.masechet === mas.name);
        return masAssignments.length > 0 && masAssignments.length < mas.dafim;
      });
      
      for (const mas of partialMasechot) {
        for (let daf = 2; daf <= mas.dafim + 1; daf++) {
          if (!getAssignment(mas.name, daf)) {
            freeDafim.push({ masechet: mas.name, daf });
          }
        }
      }
      
      // Then add from masechot not started yet
      for (const mas of MASECHOT_DATA) {
        if (!partialMasechot.includes(mas)) {
          for (let daf = 2; daf <= mas.dafim + 1; daf++) {
            if (!getAssignment(mas.name, daf)) {
              freeDafim.push({ masechet: mas.name, daf });
            }
          }
        }
      }
      
      const toAssign = freeDafim.slice(0, count);
      
      if (toAssign.length === 0) {
        showToast('אין דפים פנויים!', 'error');
        return;
      }
      
      // Show confirmation
      const summary = {};
      toAssign.forEach(d => {
        summary[d.masechet] = (summary[d.masechet] || 0) + 1;
      });
      
      const summaryText = Object.entries(summary).map(([m, c]) => `${m}: ${c}`).join(', ');
      
      showModal(`
        <div class="p-6">
          <h3 class="text-lg font-bold text-amber-400 mb-4">אישור שיבוץ</h3>
          <p class="text-white mb-2">שם: ${identity.name}</p>
          <p class="text-slate-400 text-sm mb-4">${toAssign.length} דפים: ${summaryText}</p>
          <div class="flex gap-3">
            <button onclick="closeModal(event)" class="flex-1 bg-slate-600 hover:bg-slate-500 text-white font-semibold py-3 px-4 rounded-xl transition-all">
              ביטול
            </button>
            <button id="confirm-auto-btn" onclick="executeAutoAssign()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 px-4 rounded-xl transition-all">
              אשר
            </button>
          </div>
        </div>
      `);
      
      // Store data for confirmation
      window.pendingAutoAssign = { name: identity.name, phone: identity.phone, dedication: identity.dedication, dafim: toAssign };
    }

    async function executeAutoAssign() {
      const { name, phone, dedication, dafim } = window.pendingAutoAssign;
      const btn = document.getElementById('confirm-auto-btn');
      if (btn) {
        btn.disabled = true;
        btn.textContent = 'משבץ...';
      }
      
      const grouped = {};
      dafim.forEach(d => {
        if (!grouped[d.masechet]) {
          grouped[d.masechet] = [];
        }
        grouped[d.masechet].push(d.daf);
      });
      const records = [];
      Object.entries(grouped).forEach(([masechet, dafs]) => {
        const ranges = buildDafRanges(dafs.sort((a, b) => a - b));
        ranges.forEach(range => {
          records.push({
            masechet: masechet,
            daf: range.start,
            daf_end: range.end,
            name: name,
            phone: phone,
            dedication: dedication,
            learned: false,
            is_full_masechet: false
          });
        });
      });
      const result = await window.dataSdk.createBulk(records, { skipRefresh: true });
      if (result.isOk) {
        await refreshAssignments();
        showAssignmentSuccess(name, records);
      } else {
        closeModal({ target: { }, currentTarget: { } });
        showToast('שגיאה בשיבוץ', 'error');
      }
    }

    // ========== RANGE ASSIGN ==========
    function openRangeAssign() {
      showModal(`
        <div class="p-6">
          <h3 class="text-lg font-bold text-amber-400 mb-4">שיבוץ טווח דפים</h3>
          <form id="range-form" class="space-y-4" onsubmit="event.preventDefault(); processRangeStep1()">
            <div>
              <label for="range-name" class="block text-sm font-medium text-slate-300 mb-1">שם *</label>
              <input type="text" id="range-name" required
                class="w-full bg-slate-700 border border-slate-600 rounded-xl px-4 py-3 text-white focus:border-amber-500 focus:outline-none">
            </div>
            <div>
              <label for="range-phone" class="block text-sm font-medium text-slate-300 mb-1">טלפון *</label>
              <input type="tel" id="range-phone" inputmode="numeric" required
                class="w-full bg-slate-700 border border-slate-600 rounded-xl px-4 py-3 text-white focus:border-amber-500 focus:outline-none"
                placeholder="05XXXXXXXX">
            </div>
            <div>
              <label for="range-masechet" class="block text-sm font-medium text-slate-300 mb-1">מסכת</label>
              <select id="range-masechet" onchange="updateRangeDafimOptions()"
                class="w-full bg-slate-700 border border-slate-600 rounded-xl px-4 py-3 text-white focus:border-amber-500 focus:outline-none">
                ${MASECHOT_DATA.map(m => `<option value="${m.name}">${m.name}</option>`).join('')}
              </select>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label for="range-from" class="block text-sm font-medium text-slate-300 mb-1">מדף</label>
                <select id="range-from"
                  class="w-full bg-slate-700 border border-slate-600 rounded-xl px-4 py-3 text-white focus:border-amber-500 focus:outline-none">
                </select>
              </div>
              <div>
                <label for="range-to" class="block text-sm font-medium text-slate-300 mb-1">עד דף</label>
                <select id="range-to"
                  class="w-full bg-slate-700 border border-slate-600 rounded-xl px-4 py-3 text-white focus:border-amber-500 focus:outline-none">
                </select>
              </div>
            </div>
            <div>
              <label for="range-dedication" class="block text-sm font-medium text-slate-300 mb-1">הקדשה / הערה</label>
              <textarea id="range-dedication" rows="2"
                class="w-full bg-slate-700 border border-slate-600 rounded-xl px-4 py-3 text-white focus:border-amber-500 focus:outline-none resize-none"></textarea>
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 px-4 rounded-xl transition-all">
              המשך
            </button>
          </form>
        </div>
      `);
      
      setTimeout(updateRangeDafimOptions, 0);
    }

    function updateRangeDafimOptions() {
      const masechet = document.getElementById('range-masechet')?.value;
      if (!masechet) return;
      
      const mas = MASECHOT_DATA.find(m => m.name === masechet);
      const fromSelect = document.getElementById('range-from');
      const toSelect = document.getElementById('range-to');
      
      // Get free dafim
      const freeDafim = [];
      for (let daf = 2; daf <= mas.dafim + 1; daf++) {
        if (!getAssignment(masechet, daf)) {
          freeDafim.push(daf);
        }
      }
      
      fromSelect.innerHTML = freeDafim.map(d => `<option value="${d}">${formatDafNumber(d)}</option>`).join('');
      toSelect.innerHTML = freeDafim.map(d => `<option value="${d}">${formatDafNumber(d)}</option>`).join('');
      
      if (freeDafim.length > 0) {
        toSelect.value = freeDafim[freeDafim.length - 1];
      }
    }

    async function processRangeStep1() {
      const name = document.getElementById('range-name').value.trim();
      const phone = document.getElementById('range-phone').value.trim();
      const masechet = document.getElementById('range-masechet').value;
      const fromDaf = parseInt(document.getElementById('range-from').value);
      const toDaf = parseInt(document.getElementById('range-to').value);
      const dedication = document.getElementById('range-dedication').value.trim();
      
      const identity = await resolveSignupIdentity(name, phone, dedication);
      if (!identity) return;
      if (fromDaf > toDaf) {
        showToast('אנא בדוק את הנתונים', 'error');
        return;
      }
      
      // Check for occupied dafim in range
      const dafimToAssign = [];
      let hasOccupied = false;
      
      for (let daf = fromDaf; daf <= toDaf; daf++) {
        if (getAssignment(masechet, daf)) {
          hasOccupied = true;
        } else {
          dafimToAssign.push(daf);
        }
      }
      
      if (hasOccupied) {
        showToast('הטווח מכיל דפים תפוסים, רק הפנויים ישובצו', 'info');
      }
      
      if (dafimToAssign.length === 0) {
        showToast('אין דפים פנויים בטווח זה', 'error');
        return;
      }
      
      // Execute assignment
      showModal(`
        <div class="p-6 text-center">
          <div class="animate-spin w-12 h-12 border-4 border-amber-500 border-t-transparent rounded-full mx-auto mb-4"></div>
          <p class="text-slate-300">משבץ ${dafimToAssign.length} דפים...</p>
        </div>
      `);
      
      const ranges = buildDafRanges(dafimToAssign);
      const records = ranges.map(range => ({
        masechet: masechet,
        daf: range.start,
        daf_end: range.end,
        name: identity.name,
        phone: identity.phone,
        dedication: identity.dedication,
        learned: false,
        is_full_masechet: false
      }));
      const result = await window.dataSdk.createBulk(records, { skipRefresh: true });
      if (result.isOk) {
        await refreshAssignments();
        showAssignmentSuccess(identity.name, records);
      } else {
        closeModal({ target: {}, currentTarget: {} });
        showToast('שגיאה בשיבוץ', 'error');
      }
    }

    // ========== CRUD OPERATIONS ==========
    async function submitAssignment(masechet, daf, isEdit) {
      const name = document.getElementById('assign-name').value.trim();
      const phone = document.getElementById('assign-phone').value.trim();
      const dedication = document.getElementById('assign-dedication').value.trim();
      
      if (isEdit) {
        const assignment = getAssignment(masechet, daf);
        if (!assignment) {
          closeModal({ target: {}, currentTarget: {} });
          return;
        }
        if (!isValidPhone(normalizePhone(phone))) {
          showToast('אנא הזן מספר טלפון תקין', 'error');
          return;
        }
        if (!name) {
          showToast('אנא הזן שם', 'error');
          return;
        }
        const existingByPhone = findExistingUserByPhone(normalizePhone(phone));
        let resolvedName = name;
        if (existingByPhone && existingByPhone.name !== name) {
          const choice = await openPhoneConflictModal(existingByPhone.name, name);
          if (choice !== 'use_existing') {
            return;
          }
          resolvedName = existingByPhone.name;
        }
        const updateRecord = {
          id: assignment.id,
          masechet: assignment.masechet,
          daf: assignment.range_start ?? assignment.daf,
          daf_end: assignment.range_end ?? getRangeEnd(assignment),
          name: resolvedName,
          phone: normalizePhone(phone),
          dedication: dedication,
          learned: assignment.learned,
          is_full_masechet: assignment.is_full_masechet
        };
        const result = await window.dataSdk.update(updateRecord);
        if (result.isOk) {
          closeModal({ target: {}, currentTarget: {} });
          showActionDoneModal('הפרטים עודכנו.');
        } else {
          showToast('שגיאה בעדכון', 'error');
          closeModal({ target: {}, currentTarget: {} });
        }
        return;
      }
      const identity = await resolveSignupIdentity(name, phone, dedication);
      if (!identity) return;
      const result = await window.dataSdk.create({
        masechet: masechet,
        daf: daf,
        daf_end: daf,
        name: identity.name,
        phone: identity.phone,
        dedication: identity.dedication,
        learned: false,
        is_full_masechet: false
      });
      
      if (result.isOk) {
        showAssignmentSuccess(identity.name, [{ masechet, daf }]);
      } else {
        showToast('שגיאה בשיבוץ', 'error');
        closeModal({ target: {}, currentTarget: {} });
      }
    }

    async function toggleLearnedModal(masechet, daf) {
      const assignment = getAssignment(masechet, daf);
      if (assignment) {
        const nextLearned = !assignment.learned;
        const result = await window.dataSdk.update({
          id: assignment.id,
          learned: nextLearned,
          target_daf: daf
        });
        if (result.isOk) {
          closeModal({ target: {}, currentTarget: {} });
          showActionDoneModal(nextLearned ? 'הדף סומן כנלמד.' : 'סימון נלמד בוטל.');
          renderMasechetScreen();
        } else {
          showToast('שגיאה בעדכון', 'error');
          closeModal({ target: {}, currentTarget: {} });
        }
      }
    }

    async function toggleLearned(recordId, targetDaf) {
      const record = assignments.find(a => a.id === recordId && a.daf === targetDaf);
      if (!record) {
        showToast('שיבוץ לא נמצא', 'error');
        return;
      }
      const nextLearned = !record.learned;
      const result = await window.dataSdk.update({
        id: record.id,
        learned: nextLearned,
        target_daf: targetDaf
      });
      if (result.isOk) {
        updateMyPagesView();
        showActionDoneModal(nextLearned ? 'הדף סומן כנלמד.' : 'סימון נלמד בוטל.');
      } else {
        showToast('שגיאה בעדכון', 'error');
      }
    }

    async function deleteAssignment(masechet, daf) {
      const assignment = getAssignment(masechet, daf);
      if (assignment) {
        const result = await window.dataSdk.delete({
          id: assignment.id,
          target_daf: daf
        });
        if (result.isOk) {
          closeModal({ target: {}, currentTarget: {} });
          showActionDoneModal('השיבוץ נמחק.');
        } else {
          showToast('שגיאה במחיקה', 'error');
          closeModal({ target: {}, currentTarget: {} });
        }
      }
    }

    async function executeMasechetDelete() {
      const pending = window.pendingMasechetDelete;
      if (!pending) {
        closeModal({ target: {}, currentTarget: {} });
        return;
      }
      const isOk = await deleteMasechetAssignments(pending.name, pending.masechet);
      window.pendingMasechetDelete = null;
      closeModal({ target: {}, currentTarget: {} });
      if (isOk) {
        showActionDoneModal('השיבוץ נמחק.');
      }
    }

    async function deleteMasechetAssignments(name, masechet) {
      const toDelete = assignmentRanges.filter(
        record => record.name === name && record.masechet === masechet
      );
      if (toDelete.length === 0) {
        showToast('שיבוץ לא נמצא', 'error');
        return false;
      }
      for (const record of toDelete) {
        const result = await window.dataSdk.delete({ id: record.id });
        if (!result.isOk) {
          showToast('שגיאה במחיקה', 'error');
          return false;
        }
      }
      updateMyPagesView();
      return true;
    }

    async function executeRangeDelete() {
      const pending = window.pendingRangeDelete;
      if (!pending) {
        closeModal({ target: {}, currentTarget: {} });
        return;
      }
      const isOk = await deleteMasechetRange(pending.name, pending.masechet, pending.start, pending.end);
      window.pendingRangeDelete = null;
      closeModal({ target: {}, currentTarget: {} });
      if (isOk) {
        showActionDoneModal('השיבוץ נמחק.');
      }
    }

    async function executeRangeLearned() {
      const pending = window.pendingRangeLearned;
      if (!pending) {
        closeModal({ target: {}, currentTarget: {} });
        return;
      }
      const isOk = await markMasechetRangeLearned(pending.name, pending.masechet, pending.start, pending.end);
      window.pendingRangeLearned = null;
      closeModal({ target: {}, currentTarget: {} });
      if (isOk) {
        showActionDoneModal('הדפים סומנו כנלמד.');
      }
    }

    async function deleteMasechetRange(name, masechet, start, end) {
      const rangeStart = Math.min(start, end);
      const rangeEnd = Math.max(start, end);
      let deleted = false;

      for (let daf = rangeStart; daf <= rangeEnd; daf++) {
        const assignment = assignments.find(
          record => record.name === name && record.masechet === masechet && record.daf === daf
        );
        if (!assignment) {
          continue;
        }
        deleted = true;
        const result = await window.dataSdk.delete({
          id: assignment.id,
          target_daf: daf
        });
        if (!result.isOk) {
          showToast('שגיאה במחיקה', 'error');
          return;
        }
      }

      if (!deleted) {
        showToast('אין דפים למחיקה', 'error');
        return false;
      }
      updateMyPagesView();
      return true;
    }

    async function markMasechetRangeLearned(name, masechet, start, end) {
      const rangeStart = Math.min(start, end);
      const rangeEnd = Math.max(start, end);
      let updated = false;
      for (let daf = rangeStart; daf <= rangeEnd; daf++) {
        const assignment = assignments.find(
          record => record.name === name && record.masechet === masechet && record.daf === daf
        );
        if (!assignment || assignment.learned) {
          continue;
        }
        const result = await window.dataSdk.update({
          id: assignment.id,
          learned: true,
          target_daf: daf
        });
        if (!result.isOk) {
          showToast('שגיאה בעדכון', 'error');
          return false;
        }
        updated = true;
      }
      if (!updated) {
        showToast('אין דפים לעדכון', 'error');
        return false;
      }
      updateMyPagesView();
      return true;
    }

    // ========== CONFIG RENDER ==========
    function renderConfig() {
      document.getElementById('main-title').textContent = config.site_title || defaultConfig.site_title;
      document.getElementById('main-subtitle').textContent = config.site_subtitle || defaultConfig.site_subtitle;
    }

    // ========== DATA INITIALIZATION ==========
    const dataHandler = {
      onDataChanged(data) {
        assignmentRanges = data.map(normalizeAssignment);
        assignments = expandAssignments(assignmentRanges);
        renderStats();
        renderPixelMap();
        renderMasechotList();
        if (currentMasechet) {
          renderMasechetScreen();
        }
        if (!document.getElementById('all-learners-screen').classList.contains('hidden')) {
          renderAllLearnersSelect();
          renderAllLearnersView();
        }
      }
    };

    function normalizeAssignment(record) {
      const rangeEnd = record.daf_end ?? record.daf;
      return {
        ...record,
        daf_end: rangeEnd,
        phone: record.phone || '',
        learned: Boolean(record.learned),
        is_full_masechet: Boolean(record.is_full_masechet)
      };
    }

    async function refreshAssignments(handler = dataHandler) {
      try {
        const response = await fetch('/api/assignments');
        if (!response.ok) {
          throw new Error(`Failed to fetch assignments: ${response.status} ${response.statusText}`);
        }
        const data = await response.json();
        handler.onDataChanged(data);
        return true;
      } catch (error) {
        console.error(error);
        handler.onDataChanged([]);
        showToast('שגיאה בטעינת נתונים', 'error');
        return false;
      }
    }

    function logHttpError(action, response) {
      console.error(`${action} failed`, response.status, response.statusText);
    }

    window.dataSdk = {
      async init(handler) {
        const result = await refreshAssignments(handler);
        return { isOk: result };
      },
      async create(record, options = {}) {
        try {
          const response = await fetch('/api/assignments', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(record)
          });
          if (!response.ok) {
            logHttpError('Create assignment', response);
            return { isOk: false };
          }
          if (!options.skipRefresh) {
            await refreshAssignments();
          }
          return { isOk: true };
        } catch (error) {
          console.error(error);
          return { isOk: false };
        }
      },
      async createBulk(records, options = {}) {
        if (!Array.isArray(records) || records.length === 0) {
          return { isOk: false };
        }
        try {
          const response = await fetch('/api/assignments', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ assignments: records })
          });
          if (!response.ok) {
            logHttpError('Create assignments', response);
            return { isOk: false };
          }
          if (!options.skipRefresh) {
            await refreshAssignments();
          }
          return { isOk: true };
        } catch (error) {
          console.error(error);
          return { isOk: false };
        }
      },
      async update(record, options = {}) {
        if (!record?.id) {
          return { isOk: false };
        }
        try {
          const response = await fetch(`/api/assignments/${record.id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(record)
          });
          if (!response.ok) {
            logHttpError('Update assignment', response);
            return { isOk: false };
          }
          if (!options.skipRefresh) {
            await refreshAssignments();
          }
          return { isOk: true };
        } catch (error) {
          console.error(error);
          return { isOk: false };
        }
      },
      async delete(record, options = {}) {
        if (!record?.id) {
          return { isOk: false };
        }
        try {
          const targetDaf = record?.target_daf ?? record?.targetDaf;
          const url = (targetDaf !== undefined && targetDaf !== null)
            ? `/api/assignments/${record.id}?daf=${encodeURIComponent(targetDaf)}`
            : `/api/assignments/${record.id}`;
          const response = await fetch(url, {
            method: 'DELETE'
          });
          if (!response.ok) {
            logHttpError('Delete assignment', response);
            return { isOk: false };
          }
          if (!options.skipRefresh) {
            await refreshAssignments();
          }
          return { isOk: true };
        } catch (error) {
          console.error(error);
          return { isOk: false };
        }
      }
    };

    renderConfig();
    updateCountdown();
    setInterval(updateCountdown, 1000);
    window.dataSdk.init(dataHandler).then(result => {
      if (!result.isOk) {
        console.error("Failed to initialize data");
      }
      if (window.location.pathname === '/dafdaf') {
        openAllLearners();
      }
    });
  </script>
</body>
</html>
